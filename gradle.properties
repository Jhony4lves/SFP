org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# Distribuições Android devem incrementar SFP_VERSION_CODE monotonamente.
# RC5 do ciclo 2.2: integridade de saldo em transferências históricas importadas.
# Transferências de extrato anteriores à data-base não alteram o saldo atual e registros antigos são reparados no normalize().
SFP_VERSION_CODE=14
SFP_VERSION_NAME=2.2.0-rc.5
