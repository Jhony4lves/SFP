org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# Distribuições Android devem incrementar SFP_VERSION_CODE monotonamente.
# RC7 do ciclo 2.2: concilia saldo final oficial do extrato e permite
# reimportação incremental, aceitando apenas movimentos ainda inéditos.
SFP_VERSION_CODE=16
SFP_VERSION_NAME=2.2.0-rc.7
