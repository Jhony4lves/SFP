plugins {
    id 'com.android.application'
}

def sfpVersionCode = providers.gradleProperty("SFP_VERSION_CODE").get().toInteger()
def sfpVersionName = providers.gradleProperty("SFP_VERSION_NAME").get()

android {
    namespace 'com.jhony.sfp'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.jhony.sfp"
        minSdk 26
        targetSdk 35
        versionCode sfpVersionCode
        versionName sfpVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def ks = System.getenv("SFP_KEYSTORE_PATH")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("SFP_KEYSTORE_PASSWORD")
                keyAlias System.getenv("SFP_KEY_ALIAS")
                keyPassword System.getenv("SFP_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (System.getenv("SFP_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
