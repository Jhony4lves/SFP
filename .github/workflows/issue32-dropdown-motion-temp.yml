name: Apply Issue 32 dropdown motion fix

on:
  push:
    branches: ["fix/issue32-dropdown-placement-motion"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/issue32-dropdown-placement-motion

      - name: Apply focused dropdown motion patch
        shell: bash
        run: |
          echo ' yZXR1cm47Y29uc3QgcmVjdD1idXR0b24uZ2V0Qm91bmRpbmdDbGllbnRSZWN0KCksbWFyZ2luPTgsZ2FwPTYsdnc9ZG9jdW1lbnQuZG9jdW1lbnRFbGVtZW50LmNsaWVudFdpZHRoLHZ hPWdsb2JhbC5pbm5lckhlaWdodHx8ZG9jdW1lbnQuZG9jdW1lbnRFbGVtZW50LmNsaWVudEhlaWdodCxuYXY9ZG9jdW1lbnQucXVlcnlTZWxlY3RvcignLnNpZGViYXIgLm5hdicpLG5hdlJlY3Q9bmF2Py5nZXRCb3VuZGluZ0NsaWVudFJlY3QoKSx1c2FibGVCb3R0b209bmF2UmVjdCYmbmF2UmVjdC50b3A+MCYmbmF2UmVjdC50b3A8dm       ' | base64 -d > /tmp/issue32-dropdown-motion.py
          python /tmp/issue32-dropdown-motion.py

      - name: Validate focused patch
        shell: bash
        run: |
          set -euo pipefail
          grep -q "function animatePlacementChange" app/src/main/assets/www/financial-insights-ui.js
          grep -q "hysteresis=52" app/src/main/assets/www/financial-insights-ui.js
          grep -q "placement change is animated and resists threshold thrash" qa/dropdown-scroll-nav.spec.js
          grep -q "SFP_VERSION_CODE=8" gradle.properties
          grep -q "SFP_VERSION_NAME=2.1.0-rc.4" gradle.properties
          git diff --check

      - name: Commit patch and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/issue32-dropdown-motion-temp.yml
          git add app/src/main/assets/www/financial-insights-ui.js qa/dropdown-scroll-nav.spec.js gradle.properties
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: smooth dropdown placement changes on mobile"
          git push origin HEAD:fix/issue32-dropdown-placement-motion
