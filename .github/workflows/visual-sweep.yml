name: SFP Visual Sweep

on:
  push:
    branches: ["qa/visual-bug-fix-sweep-2026-09-02"]
  workflow_dispatch:

jobs:
  visual-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test qa/visual-bug-sweep.spec.js --reporter=list
