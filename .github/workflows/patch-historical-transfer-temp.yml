name: Patch historical imported transfer balance

on:
  push:
    branches:
      - fix/2.2-historical-transfer-balance

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/2.2-historical-transfer-balance
          fetch-depth: 0
      - name: Patch integrity bug and bump RC5
        run: python3 .github/patch_rc5.py
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/www/index.html gradle.properties
          git diff --cached --check
          git commit -m "fix: neutralize historical imported transfers in balances"
          git push origin HEAD:fix/2.2-historical-transfer-balance
