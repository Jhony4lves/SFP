name: Refine debt contract-total patch

on:
  push:
    branches:
      - feat/debt-contract-total

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/debt-contract-total
          fetch-depth: 0
      - name: Apply ledger refinement
        run: python3 tools/refine_debt_contract_total.py
      - name: Verify
        run: |
          grep -q 'pricingUnallocated' app/src/main/assets/www/index.html
          grep -q 'data do recebimento não pode ser posterior' app/src/main/assets/www/index.html
          test ! -f tools/refine_debt_contract_total.py
          test ! -f .github/workflows/debt-contract-total-refine.yml
          git diff --check
      - name: Commit refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: keep unknown-rate debt ledger semantically honest'
          git push origin HEAD:feat/debt-contract-total
