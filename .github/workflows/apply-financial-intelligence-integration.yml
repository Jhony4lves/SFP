name: Apply Financial Intelligence Integration

on:
  push:
    branches: ["feat/financial-intelligence-foundation"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/financial-intelligence-foundation
          fetch-depth: 0

      - name: Apply integration patch
        run: python scripts/patch_financial_intelligence.py

      - name: Install web dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run static QA
        run: npm run test:static

      - name: Run financial intelligence QA
        run: npx playwright test qa/financial-intelligence.spec.js

      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/www/index.html
          git commit -m "feat(intelligence): integrar insights ao core e à Sophy"
          git push origin HEAD:feat/financial-intelligence-foundation
