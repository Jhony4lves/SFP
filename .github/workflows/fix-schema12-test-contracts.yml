name: Fix Schema 12 Test Contracts

on:
  push:
    branches: ["feat/import-transfer-matching"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/import-transfer-matching
          fetch-depth: 0

      - name: Update stale schema expectations
        shell: python
        run: |
          from pathlib import Path

          edits = {
              Path('qa/reference-polish-v2.spec.js'): (
                  "expect(constants.schemaVersion).toBe(11);",
                  "expect(constants.schemaVersion).toBe(12);",
              ),
              Path('qa/reset-system-integrity.spec.js'): (
                  "expect(finalState.schemaVersion).toBe(11);",
                  "expect(finalState.schemaVersion).toBe(12);",
              ),
          }

          for path, (old, new) in edits.items():
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one stale contract, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')
              print(f'updated {path}')

          leftovers = []
          for path in Path('qa').glob('*.js'):
              text = path.read_text(encoding='utf-8')
              if 'schemaVersion).toBe(11)' in text:
                  leftovers.append(str(path))
          if leftovers:
              raise SystemExit('stale schema 11 assertions remain: ' + ', '.join(leftovers))

      - name: Commit test contract update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/reference-polish-v2.spec.js qa/reset-system-integrity.spec.js
          git commit -m "test: alinhar contratos ao schema 12"
          git push origin HEAD:feat/import-transfer-matching
