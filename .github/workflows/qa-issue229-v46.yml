name: Repair and validate issue 229 UI

on:
  push:
    branches:
      - fix/openfinance-transfer-retroactive-ui-229

permissions:
  contents: write

jobs:
  issue229:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Preserve expanded institution during background sync
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/assets/www/open-finance-personal.js')
          text = path.read_text()

          marker = "    root.replaceChildren();\n\n    const items=Array.isArray(result?.items)?result.items:[];"
          replacement = "    const openItems=new Set(Array.from(root.querySelectorAll('details[data-open-finance-item][open]'))\n      .map(node=>cleanText(node.dataset.openFinanceKey)).filter(Boolean));\n    root.replaceChildren();\n\n    const items=Array.isArray(result?.items)?result.items:[];"
          if marker not in text:
              raise SystemExit('renderPreview marker not found')
          text = text.replace(marker, replacement, 1)

          marker = "      const name=itemDisplayName(item);\n      const needsAttention=Boolean(item?.accountsError)||accounts.some(account=>"
          replacement = "      const name=itemDisplayName(item);\n      const itemKey=cleanText(item?.id)||normalize(name);\n      const needsAttention=Boolean(item?.accountsError)||accounts.some(account=>"
          if marker not in text:
              raise SystemExit('item name marker not found')
          text = text.replace(marker, replacement, 1)

          marker = "      section.dataset.openFinanceItem='1';\n      section.style.marginTop='10px';\n      section.open=needsAttention;"
          replacement = "      section.dataset.openFinanceItem='1';\n      section.dataset.openFinanceKey=itemKey;\n      section.style.marginTop='10px';\n      section.open=needsAttention||openItems.has(itemKey);"
          if marker not in text:
              raise SystemExit('details marker not found')
          text = text.replace(marker, replacement, 1)
          path.write_text(text)

          spec = Path('qa/open-finance-unified-sync.spec.js')
          test = spec.read_text()
          marker = "  await institution.locator(':scope > summary').click();\n\n  const txDetails = institution.locator('details[data-open-finance-transactions]').first();"
          replacement = "  await institution.locator(':scope > summary').click();\n  await expect.poll(() => institution.evaluate(node => node.open)).toBe(true);\n\n  const txDetails = institution.locator('details[data-open-finance-transactions]').first();"
          if marker not in test:
              raise SystemExit('QA institution click marker not found')
          spec.write_text(test.replace(marker, replacement, 1))
          PY

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Static checks
        run: npm run test:static
      - name: Run only affected Open Finance QA
        run: npx playwright test qa/open-finance-unified-sync.spec.js --reporter=line

      - name: Commit validated repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Jhony4lves"
          git config user.email "jhonyr.rocha@gmail.com"
          rm .github/workflows/qa-issue229-v46.yml
          git add app/src/main/assets/www/open-finance-personal.js qa/open-finance-unified-sync.spec.js .github/workflows/qa-issue229-v46.yml
          git commit -m "fix(openfinance): preservar expansão da prévia durante sincronização"
          git push origin HEAD:fix/openfinance-transfer-retroactive-ui-229
