name: Repair Open Finance card mapping workflow

on:
  push:
    branches:
      - feat/openfinance-auto-sync-navigation-226

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/openfinance-auto-sync-navigation-226
          fetch-depth: 0
      - name: Repair workflow syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          target=Path('.github/workflows/fix-openfinance-card-mapping-once.yml')
          lines=target.read_text(encoding='utf-8').splitlines(keepends=True)
          kept=[]
          removed=0
          for line in lines:
              if line.startswith('    if:'):
                  removed+=1
                  continue
              kept.append(line)
          if removed!=1:
              raise SystemExit(f'Expected exactly one job if line, removed={removed}')
          target.write_text(''.join(kept),encoding='utf-8')
          Path('.github/workflows/repair-openfinance-card-mapping-workflow.yml').unlink()
          PY
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SFP QA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/fix-openfinance-card-mapping-once.yml .github/workflows/repair-openfinance-card-mapping-workflow.yml
          git commit -m 'chore: repair one-time card mapping workflow'
          git push origin HEAD:feat/openfinance-auto-sync-navigation-226
