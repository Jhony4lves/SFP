name: Patch PR41 compatibility
on:
  push:
    branches: [fix/report-err-008-011]
    paths: [.github/workflows/patch-pr41-compat.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/report-err-008-011
          fetch-depth: 0
      - name: Restore canonical polish suite and apply compatibility patch
        run: |
          git show origin/main:qa/polish-integrity.spec.js > qa/polish-integrity.spec.js
          python - <<'PY'
          from pathlib import Path

          p = Path('qa/polish-integrity.spec.js')
          s = p.read_text(encoding='utf-8')
          old = "    expect(await accountInitial.inputValue()).toBe('123.45');"
          new = "    expect(await accountInitial.inputValue()).toBe('123,45');"
          if s.count(old) != 1:
              raise SystemExit(f'polish monetary expectation: {s.count(old)} matches')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('app/src/main/assets/www/index.html')
          s = p.read_text(encoding='utf-8')

          def once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              s = s.replace(old, new, 1)

          once(
              "const form=$(def[0]);form.reset();const hidden=form.querySelector('input[type=\"hidden\"]');if(hidden)hidden.value='';if(page==='dividas'){$('debtPayment').dataset.userEdited='';$('debtRatePeriod').value='monthly';$('debtAmortization').value='price';updateDebtPaymentEstimate()}showProgressivePanel(form.closest('.management-form-panel'),def[1])",
              "const form=$(def[0]);form.reset();const hidden=form.querySelector('input[type=\"hidden\"]');if(hidden)hidden.value='';if(page==='dividas'){$('debtPayment').dataset.userEdited='';$('debtRatePeriod').dataset.userEdited='';$('debtAmortization').dataset.userEdited='';$('debtRatePeriod').value='monthly';$('debtAmortization').value='price';updateDebtPaymentEstimate()}showProgressivePanel(form.closest('.management-form-panel'),def[1])",
              'new debt markers'
          )

          old_edit = "window.editDebt=(id,fromDetail=false)=>{let d=state.debts.find(x=>x.id===id);if(!d)return;$('debtId').value=d.id;$('debtName').value=d.name;$('debtBalance').value=d.balance;$('debtRate').value=d.rate;$('debtRatePeriod').value=d.ratePeriod||'monthly';$('debtAmortization').value=d.amortizationMethod||'manual';$('debtPayment').value=d.payment;$('debtPayment').dataset.userEdited='1';$('debtFirstDue').value=d.firstDue||'';$('debtInstallments').value=d.installments||'';$('debtDay').value=d.dueDay||(+d.firstDue?.slice(8,10)||1);$('debtDay').dataset.userEdited='';$('debtAccount').value=d.accountId||state.accounts[0]?.id||'';$('debtAccount').dataset.userEdited='';$('debtMoreDetails').open=!!(d.dueDay||d.accountId||d.paymentMethod);$('debtFormTitle').textContent='Editar dívida';$('debtFormMode').textContent='Edição';$('debtSubmit').textContent='Salvar alterações';setPage('dividas');showProgressivePanel($('debtName').closest('.management-form-panel'),'Editar dívida',fromDetail?()=>openDebtDetail(id):null)}"
          new_edit = "window.editDebt=(id,fromDetail=false)=>{let d=state.debts.find(x=>x.id===id);if(!d)return;$('debtId').value=d.id;$('debtName').value=d.name;$('debtBalance').value=d.balance;$('debtRate').value=d.rate;$('debtRatePeriod').value=d.ratePeriod||'monthly';$('debtRatePeriod').dataset.userEdited='';$('debtAmortization').value=d.amortizationMethod||'manual';$('debtAmortization').dataset.userEdited='';$('debtPayment').value=d.payment;$('debtPayment').dataset.userEdited='1';$('debtFirstDue').value=d.firstDue||'';$('debtInstallments').value=d.installments||'';$('debtDay').value=d.dueDay||(+d.firstDue?.slice(8,10)||1);$('debtDay').dataset.userEdited='';$('debtAccount').value=d.accountId||state.accounts[0]?.id||'';$('debtAccount').dataset.userEdited='';$('debtMoreDetails').open=!!(d.dueDay||d.accountId||d.paymentMethod);$('debtFormTitle').textContent='Editar dívida';$('debtFormMode').textContent='Edição';$('debtSubmit').textContent='Salvar alterações';setPage('dividas');showProgressivePanel($('debtName').closest('.management-form-panel'),'Editar dívida',fromDetail?()=>openDebtDetail(id):null)}"
          once(old_edit, new_edit, 'edit debt markers')

          once(
              "$('debtRatePeriod').onchange=updateDebtPaymentEstimate;",
              "$('debtRatePeriod').onchange=()=>{$('debtRatePeriod').dataset.userEdited='1';updateDebtPaymentEstimate()};",
              'rate period edit marker'
          )
          once(
              "$('debtAmortization').onchange=()=>{if($('debtAmortization').value==='price')$('debtPayment').dataset.userEdited='';updateDebtPaymentEstimate()};",
              "$('debtAmortization').onchange=()=>{$('debtAmortization').dataset.userEdited='1';if($('debtAmortization').value==='price')$('debtPayment').dataset.userEdited='';updateDebtPaymentEstimate()};",
              'amortization edit marker'
          )

          old_submit = "let patch={id:id||uid(),name:$('debtName').value.trim(),balance:parseMoney($('debtBalance').value),rate:parseMoney($('debtRate').value),ratePeriod:$('debtRatePeriod').value||'monthly',amortizationMethod:$('debtAmortization').value||'manual',payment:parseMoney($('debtPayment').value),firstDue,installments};if(!old||Object.hasOwn(old,'dueDay')||$('debtDay').dataset.userEdited==='1')patch.dueDay=+$('debtDay').value;if(!old||Object.hasOwn(old,'accountId')||$('debtAccount').dataset.userEdited==='1')patch.accountId=+$('debtAccount').value;"
          new_submit = "let patch={id:id||uid(),name:$('debtName').value.trim(),balance:parseMoney($('debtBalance').value),rate:parseMoney($('debtRate').value),payment:parseMoney($('debtPayment').value),firstDue,installments};if(!old||Object.hasOwn(old,'ratePeriod')||$('debtRatePeriod').dataset.userEdited==='1')patch.ratePeriod=$('debtRatePeriod').value||'monthly';if(!old||Object.hasOwn(old,'amortizationMethod')||$('debtAmortization').dataset.userEdited==='1')patch.amortizationMethod=$('debtAmortization').value||'manual';if(!old||Object.hasOwn(old,'dueDay')||$('debtDay').dataset.userEdited==='1')patch.dueDay=+$('debtDay').value;if(!old||Object.hasOwn(old,'accountId')||$('debtAccount').dataset.userEdited==='1')patch.accountId=+$('debtAccount').value;"
          once(old_submit, new_submit, 'conditional debt contract fields')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit compatibility fix
        run: |
          git config user.name "SFP Patch Runner"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/assets/www/index.html qa/polish-integrity.spec.js
          git commit -m "fix(debt): preserve legacy contracts and pt-BR money UX"
          git push origin HEAD:fix/report-err-008-011
