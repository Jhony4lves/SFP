name: Apply release bridge patch

on:
  push:
    branches: [ "release/beta-engineering" ]
    paths:
      - "scripts/patch_release_bridge.py"
      - ".github/workflows/apply-release-bridge-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/beta-engineering

      - name: Apply AndroidBridge patch
        run: python scripts/patch_release_bridge.py

      - name: Verify patch markers
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'return BuildConfig.VERSION_NAME;' app/src/main/java/com/jhony/sfp/AndroidBridge.java
          grep -F '"SmartFinancialPlanner/" + BuildConfig.VERSION_NAME + " Sophy/3.0"' app/src/main/java/com/jhony/sfp/AndroidBridge.java
          ! grep -F 'return "2.0.2";' app/src/main/java/com/jhony/sfp/AndroidBridge.java

      - name: Commit patch and remove temporary automation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/jhony/sfp/AndroidBridge.java
          git rm scripts/patch_release_bridge.py .github/workflows/apply-release-bridge-patch.yml
          git commit -m "fix(android): derivar versão do BuildConfig"
          git push origin HEAD:release/beta-engineering
