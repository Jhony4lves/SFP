name: Apply Data Integrity Fixes v2
on:
  push:
    branches: [qa/bug-zero-sweep-2026-09-02]
    paths:
      - tools/apply-data-integrity-fixes-v2.js
      - .github/workflows/apply-data-integrity-fixes-v2.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/bug-zero-sweep-2026-09-02
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply structural integrity patch safely
        run: node tools/apply-data-integrity-fixes-v2.js
      - name: Commit structural integrity fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/www/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(integrity): guard references duplicates reconciliation and budgets"
          git push origin HEAD:qa/bug-zero-sweep-2026-09-02
