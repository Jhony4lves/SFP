name: Apply public sanitization

on:
  push:
    branches: ["chore/public-sanitization"]

permissions:
  contents: write

jobs:
  sanitize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/public-sanitization
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Apply deterministic sanitization
        run: node scripts/public_sanitize.mjs
      - name: Remove one-shot sanitization machinery
        run: |
          rm -f scripts/public_sanitize.mjs
          rm -f .github/workflows/public-sanitize-apply.yml
      - name: Commit sanitized public-ready tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No sanitization changes to commit"
            exit 0
          fi
          git commit -m "chore(public): sanitize demo data and remove private fixtures"
          git push origin HEAD:chore/public-sanitization
