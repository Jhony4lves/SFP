name: Transaction P1 patch

on:
  push:
    branches: ["fix/transactions-p1-context-actions"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Validate patch worker
        run: node --check tools/apply-transaction-p1-fix.mjs
      - name: Apply transaction P1 patch
        run: node tools/apply-transaction-p1-fix.mjs
      - name: Verify expected behavior markers
        run: |
          grep -F "function transactionEntryType(t)" app/src/main/assets/www/index.html
          grep -F "window.editTransfer=id=>" app/src/main/assets/www/index.html
          grep -F "entryType:currentKind" app/src/main/assets/www/index.html
          grep -F 'id="txRecurringField"' app/src/main/assets/www/index.html
          grep -F 'id="txAccountField"' app/src/main/assets/www/index.html
          git diff --check
      - name: Remove temporary patch worker
        run: rm tools/apply-transaction-p1-fix.mjs .github/workflows/transaction-p1-patch.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/www/index.html tools/apply-transaction-p1-fix.mjs .github/workflows/transaction-p1-patch.yml
          git commit -m "fix(transactions): preserve semantics and wire contextual actions"
          git push
