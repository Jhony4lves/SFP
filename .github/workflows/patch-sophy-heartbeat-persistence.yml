name: Patch Sophy heartbeat persistence
on:
  push:
    branches: [fix-sophy-heartbeat]
    paths:
      - scripts/patch_sophy_heartbeat_persistence.py
      - .github/workflows/patch-sophy-heartbeat-persistence.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix-sophy-heartbeat
      - run: python scripts/patch_sophy_heartbeat_persistence.py
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/www/index.html
          git commit -m "fix: keep heartbeat bootstrap read-only"
          git push
