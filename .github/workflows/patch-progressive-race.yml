name: Patch Progressive Race
on:
  push:
    branches: [fix/report-err-001-029]
    paths: [.github/workflows/patch-progressive-race.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/report-err-001-029
      - run: python scripts/patch_progressive_race.py
      - run: |
          git config user.name "SFP Patch Runner"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/assets/www/index.html
          git commit -m "fix(forms): avoid closing a newer progressive panel"
          git push origin HEAD:fix/report-err-001-029
