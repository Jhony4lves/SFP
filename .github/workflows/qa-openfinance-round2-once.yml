name: SFP Open Finance Round2 Focus

on:
  push:
    branches:
      - fix/physical-openfinance-round2-212-207

concurrency:
  group: sfp-openfinance-round2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Static checks
        run: npm run test:static
      - name: Open Finance physical regressions
        run: >-
          npx playwright test
          qa/open-finance-itau-cycle-truth.spec.js
          qa/open-finance-real-refresh.spec.js
          qa/open-finance-bills.spec.js
          qa/open-finance-nubank-credit-truth.spec.js
          qa/open-finance-financial-truth-242-244.spec.js
          --workers=1
