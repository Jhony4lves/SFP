name: Fix invoice import idempotency once

on:
  push:
    branches: ["chore/repository-cleanup-phase1"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/repository-cleanup-phase1
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Apply minimal fix and deterministic regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('app/src/main/assets/www/index.html')
          text = index.read_text()
          old = """  let m=\n    $('invoiceMonth')?.value||\n    state.ui.invoiceMonthByCard?.[cid]||\n    currentInvoiceMonth(c);"""
          new = """  let m=\n    state.ui.invoiceMonthByCard?.[cid]||\n    $('invoiceMonth')?.value||\n    currentInvoiceMonth(c);"""
          if text.count(old) != 1:
              raise SystemExit(f'Esperava 1 bloco renderCards alvo; encontrei {text.count(old)}')
          index.write_text(text.replace(old, new, 1))

          spec = Path('qa/import-integrity.spec.js')
          test = spec.read_text()
          old_test = """    document.querySelector('#cardImportMonth').value = '2026-09';\n    const through30 = ["""
          new_test = """    document.querySelector('#cardImportMonth').value = '2026-09';\n    document.querySelector('#invoiceCard').value = '1';\n    document.querySelector('#invoiceMonth').value = '2026-10';\n    const through30 = ["""
          if test.count(old_test) != 1:
              raise SystemExit(f'Esperava 1 cenário incremental alvo; encontrei {test.count(old_test)}')
          spec.write_text(test.replace(old_test, new_test, 1))
          PY

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run focused regression
        run: npx playwright test qa/import-integrity.spec.js --grep "fatura completa pode ser reimportada"

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-invoice-import-idempotency-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/www/index.html qa/import-integrity.spec.js .github/workflows/fix-invoice-import-idempotency-once.yml
          git commit -m "fix(invoice): preservar mês importado em re-render"
          git push origin HEAD:chore/repository-cleanup-phase1
