name: Patch Open Finance Bills 207

on:
  push:
    branches:
      - fix/open-finance-bills-export-207-208
    paths:
      - .github/workflows/patch-open-finance-bills-207.yml
      - tools/patch_open_finance_bills_207.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/open-finance-bills-export-207-208
          fetch-depth: 0
      - name: Aplicar patch
        run: |
          python tools/patch_open_finance_bills_207.py
          node --check app/src/main/assets/www/open-finance-bills.js
          grep -q '"/bills".equals(path)' app/src/main/java/com/jhony/sfp/PluggyBridge.java
          grep -q 'listBillsInternal' app/src/main/java/com/jhony/sfp/PluggyBridge.java
          grep -q 'data-sfp-open-finance-bills' app/src/main/assets/www/safe-spend.js
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/jhony/sfp/PluggyBridge.java app/src/main/assets/www/safe-spend.js
          git diff --cached --quiet && exit 0
          git commit -m "feat(open-finance): ler Bills oficiais da Pluggy (#207)"
          git push origin HEAD:fix/open-finance-bills-export-207-208
