name: Transaction P1 cleanup

on:
  push:
    branches: ["fix/transactions-p1-context-actions"]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Validate cleanup worker
        run: node --check tools/cleanup-transaction-p1.mjs
      - name: Clean patch residue
        run: node tools/cleanup-transaction-p1.mjs
      - name: Verify clean result
        run: |
          ! grep -F "window.editAccount=window.editAccount=" app/src/main/assets/www/index.html
          grep -F "window.editAccount=(id,fromDetail=false)=>" app/src/main/assets/www/index.html
          git diff --check
      - name: Remove temporary cleanup files
        run: rm tools/cleanup-transaction-p1.mjs .github/workflows/transaction-p1-cleanup.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/www/index.html tools/cleanup-transaction-p1.mjs .github/workflows/transaction-p1-cleanup.yml
          git commit -m "fix(transactions): clean patch residue"
          git push
