name: Reproduce Transfer P1

on:
  push:
    branches: ["feat/financial-intelligence-foundation"]
  workflow_dispatch:

jobs:
  reproduce:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/financial-intelligence-foundation
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Diagnose transfer post-edit race
        run: npx playwright test qa/tmp-transfer-diagnostic.spec.js --repeat-each=10 --workers=1
