name: Reproduce Transfer P1

on:
  push:
    branches: ["feat/financial-intelligence-foundation"]
  workflow_dispatch:

jobs:
  reproduce:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/financial-intelligence-foundation
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Repeat transfer edit/delete scenario
        run: npx playwright test qa/transaction-p1-regression.spec.js -g "transferência da tabela" --repeat-each=12 --workers=1
      - name: Recheck intelligence foundation
        run: npx playwright test qa/financial-intelligence.spec.js --workers=1
