name: Apply transaction monetary guard

on:
  push:
    branches:
      - fix/transactions-p1-context-actions

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'apply transaction monetary guard [done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/transactions-p1-context-actions
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply production patch
        run: node qa/apply-transaction-monetary-guard.mjs
      - name: Validate patch markers
        run: |
          grep -F "if(el.type!=='number'&&el.inputMode!=='decimal')return false;" app/src/main/assets/www/index.html
          grep -F "for (const kind of ['expense', 'bill', 'card', 'income', 'transfer'])" qa/transaction-p1-regression.spec.js
          git diff --check
      - name: Commit production fix and remove one-shot worker
        run: |
          rm qa/apply-transaction-monetary-guard.mjs
          rm .github/workflows/apply-transaction-monetary-guard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/www/index.html qa/transaction-p1-regression.spec.js qa/apply-transaction-monetary-guard.mjs .github/workflows/apply-transaction-monetary-guard.yml
          git commit -m "fix(transactions): proteger campos textuais do formatador monetário - apply transaction monetary guard [done]"
          git push origin HEAD:fix/transactions-p1-context-actions
