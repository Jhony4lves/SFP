name: Apply Security Hardening

on:
  push:
    branches: ["qa/visual-bug-fix-sweep-2026-09-02"]
    paths:
      - "tools/apply-security-hardening.js"
      - ".github/workflows/apply-security-hardening.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: node tools/apply-security-hardening.js
      - name: Commit generated security fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/www/index.html
          if git diff --cached --quiet; then
            echo "No generated security changes."
            exit 0
          fi
          git commit -m "fix(security): escape persisted financial text in HTML sinks"
          git push
