name: Apply Issue 32 dropdown scroll fix

on:
  push:
    branches:
      - fix/issue32-dropdown-scroll-nav
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/issue32-dropdown-scroll-nav
          fetch-depth: 0
      - name: Apply patch
        run: echo '' | base64 -d | python
      - name: Validate patch
        run: |
          git diff --check
          test -f qa/dropdown-scroll-nav.spec.js
          grep -q "SFP_VERSION_CODE=7" gradle.properties
          grep -q "SFP_VERSION_NAME=2.1.0-rc.3" gradle.properties
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/issue32-dropdown-scroll-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/www/financial-insights-ui.js app/src/main/assets/www/safe-spend-ui.js qa/dropdown-scroll-nav.spec.js gradle.properties .github/workflows/issue32-dropdown-scroll-fix.yml
          git commit -m "fix: keep open dropdowns above mobile navigation"
          git push origin HEAD:fix/issue32-dropdown-scroll-nav
