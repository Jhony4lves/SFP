name: Apply Final QA Fixes

on:
  push:
    branches:
      - qa/bug-zero-sweep-2026-09-02
    paths:
      - .github/workflows/apply-final-qa-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: qa/bug-zero-sweep-2026-09-02
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply deterministic fixes
        run: node tools/apply-final-qa-fixes.js
      - name: Commit product and regression fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/www/index.html app/src/main/assets/www/financial-insights-ui.js app/src/main/assets/www/ui-hardening.css qa/android-bug-zero-contract.spec.js qa/goal-transfer-regression.spec.js qa/debt-integrity.spec.js qa/modal-a11y-final.spec.js qa/recurrence-integrity-audit.spec.js qa/ui-interaction-hardening.spec.js qa/ui-large-values.spec.js
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "fix(qa): resolve final bug-zero regressions"
          git push origin HEAD:qa/bug-zero-sweep-2026-09-02
