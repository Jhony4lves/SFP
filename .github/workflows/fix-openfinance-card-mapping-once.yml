name: Fix Open Finance card mapping once

on:
  push:
    branches:
      - feat/openfinance-auto-sync-navigation-226

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: ${{ github.event.head_commit.message != 'fix(open-finance): map generic cards safely' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/openfinance-auto-sync-navigation-226
          fetch-depth: 0

      - name: Apply focused mapping fix and regression QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/assets/www/open-finance-personal.js')
          text = path.read_text(encoding='utf-8')
          old = '''  function suggestSfpEntity(account,itemName){
            if(typeof global.state==='undefined'||!global.state)return null;
            const credit=account?.type==='CREDIT';
            const list=credit?(Array.isArray(global.state.cards)?global.state.cards:[]):(Array.isArray(global.state.accounts)?global.state.accounts:[]);
            const external=[account?.marketingName,account?.name,account?.presentationName,itemName].map(cleanText).filter(Boolean).join(' ');
            let best=null;
            for(const entity of list){
              const score=entityScore(external,entity?.name);
              if(!best||score>best.score)best={entity,score};
            }
            return best&&best.score>=4?best:null;
          }
          '''
          new = '''  function lexicalEntityScore(external,candidate){
            const a=normalize(external),b=normalize(candidate);
            if(!a||!b)return 0;
            if(a===b)return 8;
            if(a.includes(b)||b.includes(a))return 6;
            const at=tokens(a),bt=tokens(b);
            let common=0;for(const token of at)if(bt.has(token))common++;
            return common>=2?4:common===1?2:0;
          }

          function priorCardByOpenFinanceAccount(account,list){
            const accountId=cleanText(account?.id);if(!accountId)return null;
            const ids=new Set((Array.isArray(global.state?.purchases)?global.state.purchases:[])
              .filter(purchase=>cleanText(purchase?.openFinanceAccountId)===accountId)
              .map(purchase=>String(purchase?.cardId)));
            const matches=list.filter(entity=>ids.has(String(entity?.id)));
            return matches.length===1?matches[0]:null;
          }

          function paymentAccountInstitutionScore(entity,itemName){
            const accounts=Array.isArray(global.state?.accounts)?global.state.accounts:[];
            const payAccount=accounts.find(account=>sameEntityId(account?.id,entity?.payAccountId));
            return payAccount?entityScore(itemName,payAccount?.name):0;
          }

          function sameEntityId(a,b){return String(a??'')===String(b??'')&&String(a??'')!=='';}

          function lastFourScore(account,entity){
            const lastFour=cleanText(account?.lastFour).replace(/\\D/g,'').slice(-4);
            if(lastFour.length!==4)return 0;
            const explicit=[entity?.lastFour,entity?.number].map(cleanText).some(value=>value.replace(/\\D/g,'').slice(-4)===lastFour);
            if(explicit)return 8;
            const name=cleanText(entity?.name);
            return new RegExp(`(^|\\\\D)${lastFour}(\\\\D|$)`).test(name)?7:0;
          }

          function suggestSfpEntity(account,itemName){
            if(typeof global.state==='undefined'||!global.state)return null;
            const credit=account?.type==='CREDIT';
            const list=credit?(Array.isArray(global.state.cards)?global.state.cards:[]):(Array.isArray(global.state.accounts)?global.state.accounts:[]);
            if(!list.length)return null;

            if(credit){
              const prior=priorCardByOpenFinanceAccount(account,list);
              if(prior)return{entity:prior,score:100,reason:'prior-open-finance-account'};
            }

            const fields=[account?.marketingName,account?.name,account?.presentationName,itemName].map(cleanText).filter(Boolean);
            const combined=fields.join(' ');
            let best=null,tied=false;
            for(const entity of list){
              let score=entityScore(combined,entity?.name);
              for(const field of fields)score=Math.max(score,lexicalEntityScore(field,entity?.name));

              if(credit){
                const institutionScore=paymentAccountInstitutionScore(entity,itemName);
                if(institutionScore>=6)score+=5;
                else if(institutionScore>=4)score+=3;
                score+=lastFourScore(account,entity);
              }

              if(!best||score>best.score){best={entity,score};tied=false;}
              else if(score===best.score&&score>0)tied=true;
            }
            return best&&best.score>=4&&!tied?best:null;
          }
          '''
          if old not in text:
              raise SystemExit('Expected suggestSfpEntity block not found; refusing broad edit')
          path.write_text(text.replace(old,new,1),encoding='utf-8')

          qa = Path('qa/open-finance-card-mapping.spec.js')
          qa.write_text(r'''const { test, expect } = require('@playwright/test');
          const { fixture, monitor, expectBootComplete, writeIndexedDB } = require('./helpers');

          async function boot(page, value) {
            await page.goto('/');
            await page.evaluate(() => localStorage.clear());
            await writeIndexedDB(page, value);
            await page.reload();
            await expectBootComplete(page, expect, value.settings.name);
          }

          test('OPEN-FINANCE-CARD-MAP-01 mapeia Platinum da Nu Pagamentos sem depender do nome Nubank no cartão', async ({ page }) => {
            const errors = monitor(page);
            const value = fixture('Open Finance Platinum mapping');
            value.accounts = [
              { id: 1, name: 'Nubank', type: 'Conta corrente', initial: 0 },
              { id: 2, name: 'Itaú', type: 'Conta corrente', initial: 0 }
            ];
            value.cards = [
              { id: 10, name: 'Platinum', limit: 4000, closeDay: 10, dueDay: 17, payAccountId: 1, history: [] },
              { id: 20, name: 'Itaú Click', limit: 3000, closeDay: 10, dueDay: 17, payAccountId: 2, history: [] }
            ];
            await boot(page, value);

            const match = await page.evaluate(() => {
              const result = window.SFPOpenFinancePersonal.suggestSfpEntity({
                id: 'pluggy-card-nu', type: 'CREDIT', subtype: 'CREDIT_CARD',
                name: 'platinum', marketingName: 'platinum', presentationName: 'platinum', lastFour: '1234'
              }, 'Nu Pagamentos S.A. - Instituição de Pagamento (Conta Pré-paga)');
              return result ? { id: result.entity.id, name: result.entity.name, score: result.score } : null;
            });

            expect(match).not.toBeNull();
            expect(match.id).toBe(10);
            expect(match.name).toBe('Platinum');
            expect(match.score).toBeGreaterThanOrEqual(8);
            expect(errors).toEqual([]);
          });

          test('OPEN-FINANCE-CARD-MAP-02 mantém sem vínculo quando dois cartões da mesma instituição empatam', async ({ page }) => {
            const errors = monitor(page);
            const value = fixture('Open Finance ambiguous mapping');
            value.accounts = [{ id: 1, name: 'Nubank', type: 'Conta corrente', initial: 0 }];
            value.cards = [
              { id: 10, name: 'Cartão A', limit: 4000, closeDay: 10, dueDay: 17, payAccountId: 1, history: [] },
              { id: 11, name: 'Cartão B', limit: 4000, closeDay: 10, dueDay: 17, payAccountId: 1, history: [] }
            ];
            await boot(page, value);

            const match = await page.evaluate(() => window.SFPOpenFinancePersonal.suggestSfpEntity({
              id: 'pluggy-card-generic', type: 'CREDIT', subtype: 'CREDIT_CARD',
              name: null, marketingName: null, presentationName: 'Cartão de crédito', lastFour: '9999'
            }, 'Nu Pagamentos S.A. - Instituição de Pagamento (Conta Pré-paga)'));

            expect(match).toBeNull();
            expect(errors).toEqual([]);
          });

          test('OPEN-FINANCE-CARD-MAP-03 final conhecido desempata cartões da mesma instituição', async ({ page }) => {
            const errors = monitor(page);
            const value = fixture('Open Finance last four mapping');
            value.accounts = [{ id: 1, name: 'Nubank', type: 'Conta corrente', initial: 0 }];
            value.cards = [
              { id: 10, name: 'Nubank final 1234', limit: 4000, closeDay: 10, dueDay: 17, payAccountId: 1, history: [] },
              { id: 11, name: 'Nubank final 5678', limit: 4000, closeDay: 10, dueDay: 17, payAccountId: 1, history: [] }
            ];
            await boot(page, value);

            const match = await page.evaluate(() => {
              const result = window.SFPOpenFinancePersonal.suggestSfpEntity({
                id: 'pluggy-card-last-four', type: 'CREDIT', subtype: 'CREDIT_CARD',
                name: 'platinum', marketingName: 'platinum', presentationName: 'Cartão de crédito • final 5678', lastFour: '5678'
              }, 'Nu Pagamentos S.A. - Instituição de Pagamento (Conta Pré-paga)');
              return result ? result.entity.id : null;
            });

            expect(match).toBe(11);
            expect(errors).toEqual([]);
          });
          ''',encoding='utf-8')

          props = Path('gradle.properties')
          p = props.read_text(encoding='utf-8')
          p = p.replace('SFP_VERSION_CODE=44','SFP_VERSION_CODE=45',1)
          p = p.replace('SFP_VERSION_NAME=2.2.0-openfinance.25','SFP_VERSION_NAME=2.2.0-openfinance.26',1)
          props.write_text(p,encoding='utf-8')

          Path('.github/workflows/fix-openfinance-card-mapping-once.yml').unlink()
          PY

      - name: Commit focused fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SFP QA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/assets/www/open-finance-personal.js qa/open-finance-card-mapping.spec.js gradle.properties .github/workflows/fix-openfinance-card-mapping-once.yml
          git diff --cached --check
          git commit -m 'fix(open-finance): map generic cards safely'
          git push origin HEAD:feat/openfinance-auto-sync-navigation-226
