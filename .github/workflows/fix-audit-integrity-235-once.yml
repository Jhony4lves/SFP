name: Fix audit integrity #235 once

on:
  push:
    branches: ["fix/audit-integrity-safe-repair-235"]
    paths: [".github/workflows/fix-audit-integrity-235-once.yml"]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply safe audit integrity repair
        run: python3 qa/tmp-fix-audit-integrity-235.py

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Static checks
        run: npm run test:static

      - name: Run only affected audit QA
        run: npx playwright test qa/audit-actionable-review.spec.js qa/audit-wave1.spec.js qa/audit-historical-integrity-repair.spec.js

      - name: Commit validated repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Jhony4lves"
          git config user.email "jhonyr.rocha@gmail.com"
          rm .github/workflows/fix-audit-integrity-235-once.yml qa/tmp-fix-audit-integrity-235.py
          git add -A
          git commit -m "fix(audit): reparar histórico seguro e explicar críticos (#235)"
          git push origin HEAD:fix/audit-integrity-safe-repair-235
