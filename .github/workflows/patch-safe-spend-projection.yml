name: Patch Safe Spend Projection

on:
  push:
    branches: ["feat/safe-to-spend-projection"]
    paths:
      - ".github/workflows/patch-safe-spend-projection.yml"

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/safe-to-spend-projection
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - run: python3 .github/scripts/patch-safe-spend-projection.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Static QA
        run: npm run test:static
      - name: Planning regression
        run: npx playwright test qa/financial-intelligence.spec.js qa/financial-insights-ui.spec.js qa/safe-spend-projection.spec.js --workers=1
      - name: Commit product integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/www/index.html
          if git diff --cached --quiet; then
            echo "No product patch to commit."
          else
            git commit -m "feat(planning): integrar gasto seguro e projeção na tela Hoje"
            git push origin HEAD:feat/safe-to-spend-projection
          fi
