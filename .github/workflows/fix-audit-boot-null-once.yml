name: Fix audit boot null once

on:
  push:
    branches: ["feat/openfinance-auto-sync-navigation-226"]
    paths: [".github/workflows/fix-audit-boot-null-once.yml"]

permissions:
  contents: write

jobs:
  fix-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply minimal boot guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/www/audit-hardening.js')
          s=p.read_text()
          old="    window.renderAudit();\n  }\n\n  function install(){"
          new="    if(typeof state!=='undefined'&&state&&Array.isArray(state.accounts)&&Array.isArray(state.invoices)) window.renderAudit();\n  }\n\n  function install(){"
          if s.count(old)!=1:
              raise SystemExit(f'expected exactly one eager audit render, found {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY

      - name: Add boot regression contract
        shell: bash
        run: |
          cat > qa/audit-hardening-boot-regression.js <<'JS'
          const fs = require('fs');
          const src = fs.readFileSync('app/src/main/assets/www/audit-hardening.js','utf8');
          const eager = /\n\s*window\.renderAudit\(\);\s*\n\s*}\s*\n\s*\n\s*function install\(\)/;
          if (eager.test(src)) throw new Error('audit-hardening must not eagerly render before persisted state is loaded');
          const guarded = /typeof state!==['"]undefined['"]&&state&&Array\.isArray\(state\.accounts\)&&Array\.isArray\(state\.invoices\)\) window\.renderAudit\(\)/;
          if (!guarded.test(src)) throw new Error('missing explicit loaded-state guard for initial audit render');
          console.log('audit boot regression contract: ok');
          JS
          node qa/audit-hardening-boot-regression.js

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run focused affected QA
        shell: bash
        run: |
          set -euo pipefail
          node qa/audit-hardening-boot-regression.js
          npx playwright test qa/audit*.spec.js qa/financial.spec.js qa/account-integrity.spec.js qa/card-integrity.spec.js qa/debt*.spec.js

      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Jhony4lves"
          git config user.email "jhonyr.rocha@gmail.com"
          rm .github/workflows/fix-audit-boot-null-once.yml
          git add app/src/main/assets/www/audit-hardening.js qa/audit-hardening-boot-regression.js .github/workflows/fix-audit-boot-null-once.yml
          git commit -m "fix(audit): adiar render até estado persistido carregar"
          git push origin HEAD:feat/openfinance-auto-sync-navigation-226
