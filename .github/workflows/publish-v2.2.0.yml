name: Publish SFP v2.2.0

on:
  push:
    branches:
      - ops/publish-v2.2.0

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download validated stable artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 33586790953 --repo "${{ github.repository }}" --name SFP-2.2.0-release --dir dist
          test -f dist/SFP-2.2.0.apk
          test -f dist/SFP-2.2.0.aab
          test -f dist/SHA256SUMS.txt
          test -f dist/SIGNING-CERT.txt
          test -f dist/RELEASE-METADATA.txt

      - name: Publish stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v2.2.0
          TARGET=91dc93ac091ce6a46054a68e1d7587d052c61410
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" dist/* --repo "${{ github.repository }}" --target "$TARGET" --title "SFP 2.2.0" --generate-notes
          fi
