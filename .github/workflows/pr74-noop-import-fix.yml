name: PR74 no-op import fix

on:
  push:
    branches:
      - fix/2.2-import-reconciliation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2.2-import-reconciliation
          fetch-depth: 0
      - name: Patch duplicate-only import fast path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/assets/www/index.html')
          s = p.read_text(encoding='utf-8')
          old = """  if(accepted.length)state.statements.push({id:uid(),file:draft[0]?.file||'Extrato',account:acc?.name||'Conta',count:accepted.length,months:[...new Set(accepted.map(r=>ym(r.date)))],importedAt:new Date().toISOString()});\n  if(lastSavedState){autoBackup();snapshotUndo('Importar extrato',lastSavedState)}normalize();await dbSet(state);persisted=true;lastSavedState=clone(state);statementDraft=[];$('stmtReview').classList.add('hidden');$('stmtFile').value='';renderAll();toast(`${accepted.length} movimentações processadas`)\n"""
          new = """  if(!accepted.length){\n   const duplicateOnly=draft.length>0&&draft.every(r=>r.duplicate);\n   statementDraft=[];$('stmtReview').classList.add('hidden');$('stmtFile').value='';\n   if(typeof renderStatements==='function')renderStatements();\n   if(typeof renderReconcileCenter==='function')renderReconcileCenter();\n   toast(duplicateOnly?'Nenhuma movimentação nova. Este extrato já foi importado.':'Nenhuma movimentação foi importada.');\n   return\n  }\n  state.statements.push({id:uid(),file:draft[0]?.file||'Extrato',account:acc?.name||'Conta',count:accepted.length,months:[...new Set(accepted.map(r=>ym(r.date)))],importedAt:new Date().toISOString()});\n  if(lastSavedState){autoBackup();snapshotUndo('Importar extrato',lastSavedState)}normalize();await dbSet(state);persisted=true;lastSavedState=clone(state);statementDraft=[];$('stmtReview').classList.add('hidden');$('stmtFile').value='';renderAll();toast(`${accepted.length} movimentações processadas`)\n"""
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Commit fix and remove temporary workflow
        run: |
          rm .github/workflows/pr74-noop-import-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/www/index.html .github/workflows/pr74-noop-import-fix.yml
          git diff --cached --check
          git commit -m 'fix: skip persistence for duplicate-only statement imports'
          git push origin HEAD:fix/2.2-import-reconciliation
