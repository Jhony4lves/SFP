name: Apply P1 Layout Fixes

on:
  push:
    branches: ["qa/visual-bug-fix-sweep-2026-09-02"]
    paths:
      - "tools/apply-p1-layout-fixes.js"
      - ".github/workflows/apply-p1-layout-fixes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: node tools/apply-p1-layout-fixes.js
      - name: Commit generated layout fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/www/index.html app/src/main/assets/www/safe-spend-ui.js
          if git diff --cached --quiet; then
            echo "No generated layout changes."
            exit 0
          fi
          git commit -m "fix(ui): compact calendar values and preserve event detail"
          git push
