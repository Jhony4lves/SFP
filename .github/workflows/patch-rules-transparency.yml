name: Patch classification rules transparency

on:
  push:
    branches:
      - fix-rules-transparency
    paths:
      - scripts/patch_rules_transparency.py
      - .github/workflows/patch-rules-transparency.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix-rules-transparency
      - name: Apply patch
        run: python scripts/patch_rules_transparency.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/www/index.html
          git commit -m "fix: make classification learning transparent and editable"
          git push
