name: Temporary mobile nav label fix

on:
  push:
    branches:
      - fix/issue-32-theme-floating-selects

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-32-theme-floating-selects
          fetch-depth: 0

      - name: Fix mobile bottom-nav label layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ui = Path('app/src/main/assets/www/safe-spend-ui.js')
          text = ui.read_text()
          old = '''        .sidebar .nav button{display:none!important}\n        .sidebar .nav button[data-page=\"hoje\"],.sidebar .nav button[data-page=\"contas\"],.sidebar .nav button[data-page=\"cartoes\"],.sidebar .nav button[data-page=\"calendario\"],.sidebar .nav #moreNavBtn{display:flex!important}\n'''
          new = '''        .sidebar .nav button{display:none!important;min-width:0!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;padding:4px 1px!important;font-size:11px!important;gap:2px!important;text-align:center!important}\n        .sidebar .nav button[data-page=\"hoje\"],.sidebar .nav button[data-page=\"contas\"],.sidebar .nav button[data-page=\"cartoes\"],.sidebar .nav button[data-page=\"calendario\"],.sidebar .nav #moreNavBtn{display:flex!important}\n        .sidebar .nav button span{display:block!important;font-size:9.25px!important;line-height:1.15!important;margin-top:2px!important;overflow:visible!important;text-overflow:clip!important;white-space:nowrap!important;max-width:100%!important;text-align:center!important}\n'''
          if old not in text:
              raise SystemExit('Expected mobile nav CSS block not found; refusing blind patch.')
          ui.write_text(text.replace(old, new, 1))

          spec = Path('qa/theme-floating-selects.spec.js')
          text = spec.read_text()
          old = '''    const visible=await page.locator('.sidebar .nav button:visible').evaluateAll(buttons=>buttons.map(button=>({page:button.dataset.page||null,id:button.id||null,label:button.textContent.trim()})));\n    expect(visible.map(item=>item.page||item.id)).toEqual(['hoje','contas','cartoes','calendario','moreNavBtn']);\n    expect(visible.some(item=>item.page==='sophy')).toBe(false);\n    expect(visible.some(item=>item.page==='lancamentos')).toBe(false);\n    await expect(page.locator('.mobilefab')).toBeVisible();\n'''
          new = '''    const visible=await page.locator('.sidebar .nav button:visible').evaluateAll(buttons=>buttons.map(button=>{\n      const span=button.querySelector('span');\n      const style=getComputedStyle(button),labelStyle=span?getComputedStyle(span):null;\n      return {page:button.dataset.page||null,id:button.id||null,label:button.textContent.trim(),flexDirection:style.flexDirection,textOverflow:labelStyle?.textOverflow||null,whiteSpace:labelStyle?.whiteSpace||null,labelFits:span?span.scrollWidth<=span.clientWidth+1:true};\n    }));\n    expect(visible.map(item=>item.page||item.id)).toEqual(['hoje','contas','cartoes','calendario','moreNavBtn']);\n    expect(visible.map(item=>item.label)).toEqual(['Hoje','Contas','Cartões','Calendário','Mais']);\n    expect(visible.every(item=>item.flexDirection==='column')).toBe(true);\n    expect(visible.every(item=>item.textOverflow!=='ellipsis')).toBe(true);\n    expect(visible.every(item=>item.whiteSpace==='nowrap')).toBe(true);\n    expect(visible.every(item=>item.labelFits)).toBe(true);\n    expect(visible.some(item=>item.page==='sophy')).toBe(false);\n    expect(visible.some(item=>item.page==='lancamentos')).toBe(false);\n    await expect(page.locator('.mobilefab')).toBeVisible();\n'''
          if old not in text:
              raise SystemExit('Expected bottom-nav QA block not found; refusing blind patch.')
          spec.write_text(text.replace(old, new, 1))
          PY

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/nav-label-layout-fix-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/www/safe-spend-ui.js qa/theme-floating-selects.spec.js
          git diff --cached --check
          git commit -m "fix: stack mobile nav labels below icons"
          git push origin HEAD:fix/issue-32-theme-floating-selects
