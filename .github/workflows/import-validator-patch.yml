name: Import Validator Patch

on:
  push:
    branches: [ "fix/groq-import-validator" ]
    paths:
      - "scripts/patch_import_validator.py"
      - ".github/workflows/import-validator-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/groq-import-validator
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/patch_import_validator.py
      - name: Commit patched app
        run: |
          git config user.name "SFP Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/assets/www/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(import): add hybrid Groq validation and Nubank OFX handling"
          git push
