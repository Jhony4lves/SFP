name: Apply Contrast AA Final
on:
  push:
    branches: [qa/bug-zero-sweep-2026-09-02]
    paths:
      - tools/apply-contrast-aa-final.js
      - .github/workflows/apply-contrast-aa-final.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: qa/bug-zero-sweep-2026-09-02
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node tools/apply-contrast-aa-final.js
      - name: Commit AA contrast fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/www/ui-hardening.css
          git commit -m "fix(a11y): enforce AA semantic text in light theme"
          git push origin HEAD:qa/bug-zero-sweep-2026-09-02
