name: Apply Android Audit Fixes

on:
  push:
    branches:
      - qa/bug-zero-sweep-2026-09-02
    paths:
      - tools/apply-android-audit-fixes.js
      - .github/workflows/apply-android-audit-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/bug-zero-sweep-2026-09-02
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/apply-android-audit-fixes.js
      - name: Commit Android fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/AndroidManifest.xml app/src/main/java/com/jhony/sfp/AndroidBridge.java app/src/main/java/com/jhony/sfp/MainActivity.java app/src/main/res/drawable/ic_notification_small.xml
          if git diff --cached --quiet; then
            echo "No Android source changes."
          else
            git commit -m "fix(android): harden notifications backup export and file picker"
            git push origin HEAD:qa/bug-zero-sweep-2026-09-02
          fi
