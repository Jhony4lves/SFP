name: Repair contaminated historical transfers

on:
  push:
    branches: [ "fix/2.2-historical-transfer-balance-impact" ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/2.2-historical-transfer-balance-impact
      - name: Add safe normalization repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/assets/www/index.html')
          s = p.read_text()
          old = "for(const k of ['accounts','cards','transactions','transfers','purchases','invoiceAdjustments','invoices','recurring','debts','goals','assets','statements','transferEvidence','classificationRules','snapshots','trash','undo','closedMonths','csvTemplates','favorites','creditFacilities'])state[k]??=[];"
          new = old + "\n state.transfers.forEach(t=>{if((t.tags||[]).includes('extrato')&&t.statementKey&&t.date&&t.date<=state.baseDate&&t.balanceImpact===true)t.balanceImpact=false});"
          if s.count(old) != 1:
              raise SystemExit(f'expected normalize anchor once, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/www/index.html
          git commit -m "fix: repair historical imported transfers already affecting balances"
          git rm .github/workflows/repair-historical-transfer-temp.yml
          git commit -m "ci: remove historical transfer repair workflow"
          git push origin HEAD:fix/2.2-historical-transfer-balance-impact
