name: Patch rule category preservation
on:
  push:
    branches: [fix-rules-transparency]
    paths:
      - scripts/patch_rule_category_preservation.py
      - .github/workflows/patch-rule-category-preservation.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix-rules-transparency
      - run: python scripts/patch_rule_category_preservation.py
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/www/index.html
          git commit -m "fix: preserve learned rule categories"
          git push
