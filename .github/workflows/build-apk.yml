name: Build SFP Android

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SFP-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  build-release:
  runs-on: ubuntu-latest
  env:
    SFP_KEYSTORE_BASE64: ${{ secrets.SFP_KEYSTORE_BASE64 }}
    SFP_KEYSTORE_PASSWORD: ${{ secrets.SFP_KEYSTORE_PASSWORD }}
    SFP_KEY_ALIAS: ${{ secrets.SFP_KEY_ALIAS }}
    SFP_KEY_PASSWORD: ${{ secrets.SFP_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Restore signing key
        - run: echo "$SFP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sfp-release.jks"
      - name: Build signed release APK
        env:
          SFP_KEYSTORE_PATH: ${{ runner.temp }}/sfp-release.jks
          SFP_KEYSTORE_PASSWORD: ${{ secrets.SFP_KEYSTORE_PASSWORD }}
          SFP_KEY_ALIAS: ${{ secrets.SFP_KEY_ALIAS }}
          SFP_KEY_PASSWORD: ${{ secrets.SFP_KEY_PASSWORD }}
        run: gradle :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: SFP-release-apk
          path: app/build/outputs/apk/release/*.apk
