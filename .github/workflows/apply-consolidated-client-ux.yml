name: Apply consolidated client UX patch

on:
  push:
    branches:
      - fix/consolidated-client-ux-round

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/consolidated-client-ux-round
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python qa/apply-consolidated-client-ux.py
      - name: Remove temporary helper
        run: rm -f qa/apply-consolidated-client-ux.py .github/workflows/apply-consolidated-client-ux.yml
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: consolidate audit rules heartbeat and transfer UX"
          git push origin HEAD:fix/consolidated-client-ux-round
