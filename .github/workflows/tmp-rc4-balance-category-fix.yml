name: Temporary RC4 patch runner

on:
  push:
    branches:
      - fix/2.2-pdf-balance-category-semantics

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/2.2-pdf-balance-category-semantics
          fetch-depth: 0
      - name: Apply RC4 source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/tmp_rc4_patch.py')
          s=p.read_text(encoding='utf-8')
          old='s, n = re.subn(r"function parsePdfFinancialText\\(text,\\{intendedType=\'statement\',month=null\\}=\\{\\}\\)\\{.*?\\n\\}\\n\\nasync function importCardCsv", parser + "\\n\\nasync function importCardCsv", s, count=1, flags=re.S)'
          new='s, n = re.subn(r"function parsePdfFinancialText\\(text,\\{intendedType=\'statement\',month=null\\}=\\{\\}\\)\\{.*?\\n\\}\\n\\nasync function importCardCsv", lambda _m: parser + "\\n\\nasync function importCardCsv", s, count=1, flags=re.S)'
          if old not in s:
              raise SystemExit('parser replacement line not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python3 .github/tmp_rc4_patch.py
      - name: Validate and push
        shell: bash
        run: |
          set -euo pipefail
          rm .github/tmp_rc4_patch.py
          rm .github/workflows/tmp-rc4-balance-category-fix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: separate statement value from balance and category semantics"
          git push origin HEAD:fix/2.2-pdf-balance-category-semantics
