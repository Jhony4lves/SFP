name: Report Patch Runner
on:
  push:
    branches: [fix/report-err-001-029]
    paths: [.github/workflows/report-patch-runner.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/report-err-001-029
      - run: python scripts/report_patch.py
      - run: |
          git config user.name "SFP Patch Runner"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/assets/www/index.html
          git commit -m "fix: close critical report regressions"
          git push origin HEAD:fix/report-err-001-029
