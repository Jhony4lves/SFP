name: Form persistence patch

on:
  push:
    branches: ["fix/form-persistence-global"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Apply scoped patch
        run: node tools/apply-form-persistence-fix.mjs
      - name: Verify expected form flow
        run: |
          grep -F "await save(id?'Editar cartão':'Novo cartão');" app/src/main/assets/www/index.html
          grep -F "await save(id?'Editar meta':'Nova meta');" app/src/main/assets/www/index.html
          grep -F "await save(id?'Editar ativo':'Novo ativo');" app/src/main/assets/www/index.html
          git diff --check
      - name: Remove temporary patch worker
        run: rm tools/apply-form-persistence-fix.mjs .github/workflows/form-persistence-patch.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/www/index.html tools/apply-form-persistence-fix.mjs .github/workflows/form-persistence-patch.yml
          git commit -m "fix(forms): persist before clearing and closing [skip ci]"
          git push
