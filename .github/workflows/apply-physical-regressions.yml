name: Apply Physical Regression Fixes

on:
  push:
    branches:
      - fix/physical-regressions-2026-09-02
    paths:
      - tools/apply-physical-regressions.js
      - .github/workflows/apply-physical-regressions.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/physical-regressions-2026-09-02
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply fixes
        run: node tools/apply-physical-regressions.js
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/jhony/sfp/AndroidBridge.java \
                  app/src/main/java/com/jhony/sfp/MainActivity.java \
                  app/src/main/assets/www/financial-insights-ui.js \
                  app/src/main/assets/www/safe-spend-ui.js \
                  app/src/main/assets/www/ui-hardening.css \
                  qa/sophy-v3-architecture-test.mjs \
                  qa/dropdown-scroll-nav.spec.js \
                  qa/physical-device-regressions.spec.js
          git diff --cached --check
          git commit -m "fix: close physical regressions in persistence picker layout and motion"
          git push origin HEAD:fix/physical-regressions-2026-09-02
