name: Temporary Integrity 239 Validation

on:
  push:
    branches:
      - fix/audit-openfinance-integrity-239

permissions:
  contents: read

jobs:
  focused-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Static checks
        run: npm run test:static
      - name: Focused audit and Open Finance regression
        run: npx playwright test qa/audit-openfinance-integrity-239.spec.js qa/audit-historical-integrity-repair.spec.js qa/open-finance-unified-sync.spec.js --reporter=line
