name: Temporary Integrity 239 Patch

on:
  push:
    branches:
      - fix/audit-openfinance-integrity-239

permissions:
  contents: write

jobs:
  baseline-openfinance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/openfinance-auto-sync-navigation-226
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run the two integration scenarios on untouched base
        run: npx playwright test qa/open-finance-unified-sync.spec.js --grep "#203 separa|#229 promove" --reporter=line

  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply narrow integrity patch
        run: |
          python3 qa/tmp-patch-integrity-239.py
          python3 qa/tmp-compat-version-239.py
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Static checks
        run: npm run test:static
      - name: Focused audit and Open Finance regression
        run: npx playwright test qa/audit-openfinance-integrity-239.spec.js qa/audit-historical-integrity-repair.spec.js qa/open-finance-unified-sync.spec.js --reporter=line
      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/www/audit-hardening.js \
                  app/src/main/assets/www/open-finance-sync-accounts.js \
                  qa/audit-openfinance-integrity-239.spec.js
          git diff --cached --quiet && exit 0
          git commit -m "fix(integrity): reconcile Open Finance audit and duplicate ids (#239)"
          git push
