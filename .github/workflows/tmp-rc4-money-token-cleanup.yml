name: Temporary RC4 money token cleanup

on:
  push:
    branches:
      - fix/2.2-pdf-balance-category-semantics

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/2.2-pdf-balance-category-semantics
          fetch-depth: 0
      - name: Clean complete BRL tokens from PDF descriptions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/www/index.html')
          lines=p.read_text(encoding='utf-8').splitlines()
          amount_changed=label_changed=0
          out=[]
          for line in lines:
              if line.strip().startswith('const amountRe='):
                  indent=line[:len(line)-len(line.lstrip())]
                  line=indent+r"const amountRe=/((?:[+-]\s*)?(?:R\$\s*)?(?:[+-]\s*)?(?:\d{1,3}(?:\.\d{3})+|\d+)(?:,\d{2}|\.\d{2}))\s*([CD])?/ig;"
                  amount_changed+=1
              elif line.strip().startswith('function normalizeStatementLabel(value)'):
                  indent=line[:len(line)-len(line.lstrip())]
                  line=indent+r"function normalizeStatementLabel(value){return String(value||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/r\$/g,' ').replace(/\s+/g,' ').trim()}"
                  label_changed+=1
              out.append(line)
          if amount_changed!=1 or label_changed!=1:
              raise SystemExit(f'unexpected replacements amount={amount_changed} label={label_changed}')
          p.write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
          rm .github/workflows/tmp-rc4-money-token-cleanup.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: consume complete BRL tokens in statement PDF parser"
          git push origin HEAD:fix/2.2-pdf-balance-category-semantics
