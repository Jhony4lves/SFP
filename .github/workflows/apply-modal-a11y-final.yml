name: Apply Modal A11y Final
on:
  push:
    branches: [qa/bug-zero-sweep-2026-09-02]
    paths:
      - tools/apply-modal-a11y-final.js
      - .github/workflows/apply-modal-a11y-final.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: qa/bug-zero-sweep-2026-09-02
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply modal accessibility patch
        run: node tools/apply-modal-a11y-final.js
      - name: Commit modal accessibility fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/www/ui-hardening.js
          git commit -m "fix(a11y): unify modal focus escape and tab behavior"
          git push origin HEAD:qa/bug-zero-sweep-2026-09-02
