name: Apply Recurrence Integrity Fixes

on:
  push:
    branches:
      - qa/bug-zero-sweep-2026-09-02
    paths:
      - tools/apply-recurrence-integrity-fixes.js
      - .github/workflows/apply-recurrence-integrity-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/bug-zero-sweep-2026-09-02
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/apply-recurrence-integrity-fixes.js
      - name: Commit recurrence fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/www/index.html
          if git diff --cached --quiet; then
            echo "No recurrence source changes."
          else
            git commit -m "fix(recurrence): unify logical-month and active-rule contracts"
            git push origin HEAD:qa/bug-zero-sweep-2026-09-02
          fi
