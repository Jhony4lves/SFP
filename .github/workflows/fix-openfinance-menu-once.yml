name: Fix Open Finance menu once

on:
  push:
    branches: ["feat/openfinance-auto-sync-navigation-226"]
    paths: [".github/workflows/fix-openfinance-menu-once.yml"]

permissions:
  contents: write

env:
  SFP_KEYSTORE_BASE64: ${{ secrets.SFP_KEYSTORE_BASE64 }}
  SFP_KEYSTORE_PASSWORD: ${{ secrets.SFP_KEYSTORE_PASSWORD }}
  SFP_KEY_ALIAS: ${{ secrets.SFP_KEY_ALIAS }}
  SFP_KEY_PASSWORD: ${{ secrets.SFP_KEY_PASSWORD }}

jobs:
  fix-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Consolidate mobile More menu
        run: python3 qa/fix-menu-once.py

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Test impacted navigation and Open Finance behavior
        run: npx playwright test qa/open-finance-mobile-navigation.spec.js qa/open-finance-auto-sync-contract.spec.js qa/open-finance-real-refresh.spec.js qa/rebrand-v1.spec.js

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"

      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          for var in SFP_KEYSTORE_BASE64 SFP_KEYSTORE_PASSWORD SFP_KEY_ALIAS SFP_KEY_PASSWORD; do
            test -n "${!var:-}" || exit 1
          done
          printf '%s' "$SFP_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sfp-qa.jks"
          echo "SFP_KEYSTORE_PATH=$RUNNER_TEMP/sfp-qa.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle :app:testDebugUnitTest :app:assembleRelease

      - name: Commit consolidation
        shell: bash
        run: |
          rm .github/workflows/fix-openfinance-menu-once.yml qa/fix-menu-once.py
          git config user.name "Jhony4lves"
          git config user.email "jhonyr.rocha@gmail.com"
          git add -A
          git commit -m "fix(nav): manter um único menu Mais no mobile"
          git push origin HEAD:feat/openfinance-auto-sync-navigation-226

      - uses: actions/upload-artifact@v6
        with:
          name: app-release-openfinance25
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
