name: Fix Import Static Syntax

on:
  push:
    branches:
      - fix/2.2-import-reconciliation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/2.2-import-reconciliation
      - name: Patch typo
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/www/index.html')
          s=p.read_text(encoding='utf-8')
          old="confidence:best.manual?.97:.9"
          new="confidence:best.manual ? .97 : .9"
          if old not in s:
              raise SystemExit('classifier typo anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git diff --check
      - name: Commit and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-import-static-temp.yml
          git add app/src/main/assets/www/index.html
          git commit -m "fix: correct historical classifier confidence syntax"
          git push origin HEAD:fix/2.2-import-reconciliation
