name: SFP QA Lab

on:
  pull_request:
  push:
    branches: ["qa/**"]
  workflow_dispatch:

concurrency:
  group: sfp-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Select impacted web QA
        id: qa
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          declare -A tests=()
          full=false
          static=false
          invoice_pdf=false
          invoice_image=false
          sophy_arch=false
          sophy_benchmark=false

          add_glob() {
            local pattern="$1"
            local match
            for match in $pattern; do
              tests["$match"]=1
            done
          }

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || [ -z "${BASE_SHA:-}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            full=true
            static=true
            invoice_pdf=true
            invoice_image=true
            sophy_arch=true
            sophy_benchmark=true
            changed_files="manual/full QA"
          else
            git fetch --no-tags origin "${BASE_SHA}" || true
            changed_files="$(git diff --name-only "${BASE_SHA}" "${GITHUB_SHA}")"

            echo "=== ARQUIVOS ALTERADOS ==="
            printf '%s\n' "${changed_files}"

            while IFS= read -r file; do
              [ -z "${file}" ] && continue

              case "${file}" in
                qa/*.spec.js)
                  tests["${file}"]=1
                  ;;

                app/src/main/assets/www/open-finance-*.js)
                  static=true
                  add_glob 'qa/open-finance*.spec.js'
                  ;;

                app/src/main/assets/www/safe-spend*.js)
                  static=true
                  add_glob 'qa/safe-spend*.spec.js'
                  tests["qa/financial.spec.js"]=1
                  ;;

                app/src/main/assets/www/invoice-pdf-engine.js|app/src/main/assets/www/invoice-manual-reconciliation.js)
                  static=true
                  invoice_pdf=true
                  add_glob 'qa/*invoice*.spec.js'
                  ;;

                app/src/main/assets/www/invoice-image-engine.js)
                  static=true
                  invoice_image=true
                  add_glob 'qa/*invoice*.spec.js'
                  ;;

                app/src/main/assets/www/sophy-*.js)
                  static=true
                  sophy_arch=true
                  sophy_benchmark=true
                  add_glob 'qa/sophy*.spec.js'
                  ;;

                app/src/main/assets/www/financial-*.js|app/src/main/assets/www/what-if-engine.js)
                  static=true
                  tests["qa/financial.spec.js"]=1
                  add_glob 'qa/*financial*.spec.js'
                  add_glob 'qa/account-integrity.spec.js'
                  add_glob 'qa/budget-integrity.spec.js'
                  add_glob 'qa/card-integrity.spec.js'
                  add_glob 'qa/debt*.spec.js'
                  ;;

                app/src/main/assets/www/audit-hardening.js)
                  static=true
                  add_glob 'qa/audit*.spec.js'
                  ;;

                app/src/main/assets/www/ui-hardening.js|app/src/main/assets/www/ui-hardening.css)
                  static=true
                  add_glob 'qa/*ui*.spec.js'
                  add_glob 'qa/*ux*.spec.js'
                  add_glob 'qa/*a11y*.spec.js'
                  add_glob 'qa/contrast*.spec.js'
                  ;;

                app/src/main/assets/www/index.html|playwright.config.js|qa/helpers.js|qa/helpers.mjs|qa/env-setup.js|package.json|package-lock.json)
                  full=true
                  static=true
                  ;;

                docs/*|*.md|gradle.properties)
                  # Não afeta o comportamento web.
                  ;;

                app/src/main/java/*|app/src/main/AndroidManifest.xml|app/build.gradle*|build.gradle*|settings.gradle*)
                  # Coberto pelo job Android; não força Playwright.
                  ;;

                app/src/main/assets/www/*.js|app/src/main/assets/www/*.css)
                  # Arquivo de produção sem regra específica: segurança primeiro.
                  full=true
                  static=true
                  ;;

                .github/workflows/qa.yml)
                  # Alterar o seletor não deve fazê-lo cair automaticamente em QA web completo.
                  # O próprio Actions valida a sintaxe do workflow; o comportamento web só é
                  # testado quando algum arquivo funcional do app também é afetado.
                  ;;
              esac
            done <<< "${changed_files}"
          fi

          if [ "${full}" = true ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "browser_required=true" >> "$GITHUB_OUTPUT"
            echo "tests=__FULL__" >> "$GITHUB_OUTPUT"
          else
            if [ "${#tests[@]}" -gt 0 ]; then
              mapfile -t sorted_tests < <(printf '%s\n' "${!tests[@]}" | sort)
              printf -v joined '%s ' "${sorted_tests[@]}"
              joined="${joined% }"
              echo "browser_required=true" >> "$GITHUB_OUTPUT"
              echo "tests=${joined}" >> "$GITHUB_OUTPUT"
              echo "mode=impacted" >> "$GITHUB_OUTPUT"
            else
              echo "browser_required=false" >> "$GITHUB_OUTPUT"
              echo "tests=" >> "$GITHUB_OUTPUT"
              echo "mode=none" >> "$GITHUB_OUTPUT"
            fi
          fi

          echo "static=${static}" >> "$GITHUB_OUTPUT"
          echo "invoice_pdf=${invoice_pdf}" >> "$GITHUB_OUTPUT"
          echo "invoice_image=${invoice_image}" >> "$GITHUB_OUTPUT"
          echo "sophy_arch=${sophy_arch}" >> "$GITHUB_OUTPUT"
          echo "sophy_benchmark=${sophy_benchmark}" >> "$GITHUB_OUTPUT"

          echo "=== PLANO DE QA ==="
          if [ "${full}" = true ]; then
            echo "mode=full"
          elif [ "${#tests[@]}" -gt 0 ]; then
            echo "mode=impacted"
          else
            echo "mode=none"
          fi
          echo "static=${static}"
          echo "invoice_pdf=${invoice_pdf}"
          echo "invoice_image=${invoice_image}"
          echo "sophy_arch=${sophy_arch}"
          echo "sophy_benchmark=${sophy_benchmark}"
          if [ "${full}" = false ] && [ "${#tests[@]}" -gt 0 ]; then
            printf 'playwright=%s\n' "${!tests[@]}" | sort
          fi

      - name: Install Chromium for impacted Playwright tests
        if: steps.qa.outputs.browser_required == 'true'
        run: npx playwright install --with-deps chromium

      - name: Static checks
        if: steps.qa.outputs.static == 'true'
        run: npm run test:static

      - name: Invoice PDF engine
        if: steps.qa.outputs.invoice_pdf == 'true'
        run: npm run test:invoice-pdf

      - name: Invoice image engine
        if: steps.qa.outputs.invoice_image == 'true'
        run: npm run test:invoice-image

      - name: Sophy architecture
        if: steps.qa.outputs.sophy_arch == 'true'
        run: npm run test:sophy-arch

      - name: Sophy benchmark
        if: steps.qa.outputs.sophy_benchmark == 'true'
        run: npm run test:sophy-benchmark

      - name: Run full Playwright QA
        if: steps.qa.outputs.mode == 'full'
        run: npm run test:qa

      - name: Run impacted Playwright QA
        if: steps.qa.outputs.mode == 'impacted'
        shell: bash
        env:
          IMPACTED_TESTS: ${{ steps.qa.outputs.tests }}
        run: |
          set -euo pipefail
          read -r -a tests <<< "$IMPACTED_TESTS"
          echo "Executando ${#tests[@]} arquivo(s) de teste impactado(s):"
          printf ' - %s\n' "${tests[@]}"
          npx playwright test "${tests[@]}"

      - name: No web QA required
        if: steps.qa.outputs.mode == 'none'
        run: echo "Nenhum teste web foi afetado por esta alteração."

      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: web-qa-reports
          path: build/reports/playwright-html
          if-no-files-found: warn

  android-qa-build:
    runs-on: ubuntu-latest
    env:
      SFP_KEYSTORE_BASE64: ${{ secrets.SFP_KEYSTORE_BASE64 }}
      SFP_KEYSTORE_PASSWORD: ${{ secrets.SFP_KEYSTORE_PASSWORD }}
      SFP_KEY_ALIAS: ${{ secrets.SFP_KEY_ALIAS }}
      SFP_KEY_PASSWORD: ${{ secrets.SFP_KEY_PASSWORD }}
      SFP_QA_CERT_SHA256: bf036c1668644f9c5b739e827472c7b29392de54554cdfbf2890d3b764aed2d9
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Test native Pluggy refresh lifecycle
        run: |
          mkdir -p build/qa-java
          javac -d build/qa-java app/src/main/java/com/jhony/sfp/PluggyRefreshState.java qa/java/PluggyRefreshStateTest.java
          java -cp build/qa-java com.jhony.sfp.PluggyRefreshStateTest
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Require stable QA signing identity
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for var in SFP_KEYSTORE_BASE64 SFP_KEYSTORE_PASSWORD SFP_KEY_ALIAS SFP_KEY_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "::error::$var não está configurado. O QA não publicará APK com assinatura efêmera, pois isso força reinstalação e apaga o cofre Open Finance."
              missing=1
            fi
          done
          exit "$missing"
      - name: Restore persistent QA signing key
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$SFP_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sfp-qa.jks"
          test -s "$RUNNER_TEMP/sfp-qa.jks"
          echo "SFP_KEYSTORE_PATH=$RUNNER_TEMP/sfp-qa.jks" >> "$GITHUB_ENV"
      - name: Build update-safe QA APKs
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest
      - name: Verify pinned QA signatures, package identities and launcher resources
        shell: bash
        run: |
          set -euo pipefail
          expected_cert="$(printf '%s' "$SFP_QA_CERT_SHA256" | tr '[:upper:]' '[:lower:]')"
          verify_apk() {
            apk="$1"
            expected_package="$2"
            label="$3"
            echo "=== ASSINATURA DO APK $label ==="
            signature="$($ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$apk")"
            printf '%s\n' "$signature"
            actual_cert="$(printf '%s\n' "$signature" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr '[:upper:]' '[:lower:]')"
            if [ -z "$actual_cert" ] || [ "$actual_cert" != "$expected_cert" ]; then
              echo "::error::Certificado inesperado no APK $label."
              exit 1
            fi
            package_name="$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n1)"
            if [ "$package_name" != "$expected_package" ]; then
              echo "::error::Package inesperado no APK $label: $package_name (esperado $expected_package)."
              exit 1
            fi
            echo "$label signing identity pinned: $actual_cert"
            echo "$label package identity: $package_name"
          }
          verify_apk "app/build/outputs/apk/debug/app-debug.apk" "com.jhony.sfp.debug" "DEBUG"
          verify_apk "app/build/outputs/apk/release/app-release.apk" "com.jhony.sfp" "RELEASE-QA"
          echo "=== RECURSOS DE LAUNCHER EMPACOTADOS NO APK RELEASE-QA ==="
          unzip -l app/build/outputs/apk/release/app-release.apk | grep -E "res/mipmap|res/drawable|ic_launcher" || true
      - name: Record APK checksums without publishing app data
        run: |
          mkdir -p build/reports
          sha256sum app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk app/build/outputs/apk/androidTest/debug/*.apk > build/reports/android-qa-checksums.txt
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-qa-checksums
          path: build/reports/android-qa-checksums.txt
          if-no-files-found: error
      - if: success()
        uses: actions/upload-artifact@v6
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - if: success()
        uses: actions/upload-artifact@v6
        with:
          name: app-release-qa-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error