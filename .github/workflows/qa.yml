name: SFP Installed APK Diagnostic

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: sfp-diag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-diagnostic:
    runs-on: ubuntu-latest
    env:
      SFP_KEYSTORE_BASE64: ${{ secrets.SFP_KEYSTORE_BASE64 }}
      SFP_KEYSTORE_PASSWORD: ${{ secrets.SFP_KEYSTORE_PASSWORD }}
      SFP_KEY_ALIAS: ${{ secrets.SFP_KEY_ALIAS }}
      SFP_KEY_PASSWORD: ${{ secrets.SFP_KEY_PASSWORD }}
      SFP_QA_CERT_SHA256: bf036c1668644f9c5b739e827472c7b29392de54554cdfbf2890d3b764aed2d9
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Restore signing key
        shell: bash
        run: |
          set -euo pipefail
          for var in SFP_KEYSTORE_BASE64 SFP_KEYSTORE_PASSWORD SFP_KEY_ALIAS SFP_KEY_PASSWORD; do
            test -n "${!var:-}" || { echo "::error::$var ausente"; exit 1; }
          done
          printf '%s' "$SFP_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sfp-diag.jks"
          test -s "$RUNNER_TEMP/sfp-diag.jks"
          echo "SFP_KEYSTORE_PATH=$RUNNER_TEMP/sfp-diag.jks" >> "$GITHUB_ENV"
      - name: Build diagnostic release APK
        run: gradle :app:assembleRelease
      - name: Verify diagnostic package and signature
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          package_name="$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n1)"
          test "$package_name" = "com.jhony.sfpdiag"
          signature="$($ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$apk")"
          actual_cert="$(printf '%s\n' "$signature" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr '[:upper:]' '[:lower:]')"
          test "$actual_cert" = "$SFP_QA_CERT_SHA256"
          echo "diagnostic package: $package_name"
          echo "diagnostic cert: $actual_cert"
      - uses: actions/upload-artifact@v6
        with:
          name: sfp-installed-diagnostic-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
