name: SFP QA Lab

on:
  pull_request:
  push:
    branches: ["main", "qa/**"]
  workflow_dispatch:

concurrency:
  group: sfp-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Validate QA impact selector
        run: npm run test:qa-selector

      - name: Select impacted web QA
        id: qa
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            plan="$(node qa/select-web-qa.mjs --full)"
            echo "Full QA: evento $GITHUB_EVENT_NAME."
          else
            git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
            merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
            mapfile -t changed_files < <(git diff --name-only "$merge_base" "$HEAD_SHA")

            echo "=== ARQUIVOS ALTERADOS ==="
            printf '%s\n' "${changed_files[@]}"

            plan="$(node qa/select-web-qa.mjs "${changed_files[@]}")"
          fi

          echo "=== PLANO DE QA ==="
          echo "$plan" | python3 -m json.tool

          echo "mode=$(jq -r '.mode' <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "browser_required=$(jq -r '.browserRequired' <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "tests=$(jq -r '.tests | join(" ")' <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "static=$(jq -r '.staticCheck' <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "invoice_pdf=$(jq -r '.invoicePdf' <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "invoice_image=$(jq -r '.invoiceImage' <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "sophy_arch=$(jq -r '.sophyArch' <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "sophy_benchmark=$(jq -r '.sophyBenchmark' <<<"$plan")" >> "$GITHUB_OUTPUT"

      - name: Install Chromium for Playwright
        if: steps.qa.outputs.browser_required == 'true'
        run: npx playwright install --with-deps chromium

      - name: Static checks
        if: steps.qa.outputs.static == 'true'
        run: npm run test:static

      - name: Invoice PDF engine
        if: steps.qa.outputs.invoice_pdf == 'true'
        run: npm run test:invoice-pdf

      - name: Invoice image engine
        if: steps.qa.outputs.invoice_image == 'true'
        run: npm run test:invoice-image

      - name: Sophy architecture
        if: steps.qa.outputs.sophy_arch == 'true'
        run: npm run test:sophy-arch

      - name: Sophy benchmark
        if: steps.qa.outputs.sophy_benchmark == 'true'
        run: npm run test:sophy-benchmark

      - name: Run full Playwright QA
        if: steps.qa.outputs.mode == 'full'
        run: npm run test:qa

      - name: Run impacted Playwright QA
        if: steps.qa.outputs.mode == 'impacted'
        shell: bash
        env:
          IMPACTED_TESTS: ${{ steps.qa.outputs.tests }}
        run: |
          set -euo pipefail
          read -r -a tests <<< "$IMPACTED_TESTS"
          echo "Executando ${#tests[@]} arquivo(s) de teste impactado(s):"
          printf ' - %s\n' "${tests[@]}"
          node -r ./qa/env-setup.js ./node_modules/.bin/playwright test "${tests[@]}"

      - name: No browser QA required
        if: steps.qa.outputs.mode == 'none' || steps.qa.outputs.mode == 'support-only'
        run: echo "Nenhum teste Playwright foi necessário para esta alteração."

      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: web-qa-reports
          path: build/reports/playwright-html
          if-no-files-found: warn
          retention-days: 14

  android-qa-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: gradle :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Inspect APK launcher resources
        run: |
          echo "=== RECURSOS DE LAUNCHER EMPACOTADOS NO APK DEBUG ==="
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "res/mipmap|res/drawable|ic_launcher" || true
      - name: Record APK checksums without publishing app data
        run: |
          mkdir -p build/reports
          sha256sum app/build/outputs/apk/debug/*.apk app/build/outputs/apk/androidTest/debug/*.apk > build/reports/android-qa-checksums.txt
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-qa-checksums
          path: build/reports/android-qa-checksums.txt
          if-no-files-found: error
          retention-days: 14
