name: SFP QA Lab

on:
  pull_request:
  push:
    branches: ["qa/**"]
  workflow_dispatch:

jobs:
  web-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:static
      - run: npm run test:sophy-arch
      - run: npm run test:sophy-benchmark
      - run: npm run test:financial
      - run: npm run test:qa
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: web-qa-reports
          path: build/reports/playwright-html
          if-no-files-found: warn

  android-qa-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: gradle :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Inspect APK launcher resources
        run: |
          echo "=== RECURSOS DE LAUNCHER EMPACOTADOS NO APK DEBUG ==="
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "res/mipmap|res/drawable|ic_launcher" || true
      - name: Record APK checksums without publishing app data
        run: |
          mkdir -p build/reports
          sha256sum app/build/outputs/apk/debug/*.apk app/build/outputs/apk/androidTest/debug/*.apk > build/reports/android-qa-checksums.txt
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-qa-checksums
          path: build/reports/android-qa-checksums.txt
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
