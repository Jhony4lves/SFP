name: Build signed RC4 for physical validation

on:
  push:
    branches: ["fix/issue32-dropdown-placement-motion"]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      SFP_KEYSTORE_BASE64: ${{ secrets.SFP_KEYSTORE_BASE64 }}
      SFP_KEYSTORE_PASSWORD: ${{ secrets.SFP_KEYSTORE_PASSWORD }}
      SFP_KEY_ALIAS: ${{ secrets.SFP_KEY_ALIAS }}
      SFP_KEY_PASSWORD: ${{ secrets.SFP_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/issue32-dropdown-placement-motion

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"

      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Validate RC4 version and signing configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^SFP_VERSION_CODE=8$' gradle.properties
          grep -q '^SFP_VERSION_NAME=2.1.0-rc.4$' gradle.properties
          for var in SFP_KEYSTORE_BASE64 SFP_KEYSTORE_PASSWORD SFP_KEY_ALIAS SFP_KEY_PASSWORD; do
            test -n "${!var:-}" || { echo "::error::$var não está configurado"; exit 1; }
          done

      - name: Restore signing key
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$SFP_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sfp-release.jks"
          test -s "$RUNNER_TEMP/sfp-release.jks"

      - name: Build signed RC4 APK
        env:
          SFP_KEYSTORE_PATH: ${{ runner.temp }}/sfp-release.jks
          SFP_KEYSTORE_PASSWORD: ${{ secrets.SFP_KEYSTORE_PASSWORD }}
          SFP_KEY_ALIAS: ${{ secrets.SFP_KEY_ALIAS }}
          SFP_KEY_PASSWORD: ${{ secrets.SFP_KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Verify and stage RC4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/SFP-2.1.0-rc.4.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/SFP-2.1.0-rc.4.apk | tee dist/SIGNING-CERT.txt
          sha256sum dist/SFP-2.1.0-rc.4.apk | tee dist/SHA256SUMS.txt
          cat > dist/RC4-METADATA.txt <<EOF
          versionName=2.1.0-rc.4
          versionCode=8
          sourceCommit=${GITHUB_SHA}
          branch=fix/issue32-dropdown-placement-motion
          purpose=Issue #32 physical motion validation
          EOF

      - uses: actions/upload-artifact@v6
        with:
          name: SFP-2.1.0-rc.4-signed-physical-gate
          path: dist/*
          if-no-files-found: error

      - name: Remove temporary workflow from branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/rc4-signed-branch-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary RC4 signing workflow"
          git push origin HEAD:fix/issue32-dropdown-placement-motion
