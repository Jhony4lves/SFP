name: Cleanup Bug Zero Temp
on:
  push:
    branches: [qa/bug-zero-sweep-2026-09-02]
    paths:
      - tools/cleanup-bug-zero-temp.js
      - .github/workflows/cleanup-bug-zero-temp.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: qa/bug-zero-sweep-2026-09-02
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node tools/cleanup-bug-zero-temp.js
      - name: Commit clean branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(qa): remove temporary bug-zero patchers"
          git push origin HEAD:qa/bug-zero-sweep-2026-09-02
