name: Publish SFP 2.1.0 stable

on:
  push:
    branches:
      - release/2.1.0
    paths:
      - .github/workflows/release-2.1.0-publish-temp.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download stable bundle built from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 33422538662 -n SFP-2.1.0-release -D release-bundle
          test -f release-bundle/SFP-2.1.0.apk
          test -f release-bundle/SFP-2.1.0.aab
          test -f release-bundle/RELEASE-METADATA.txt
          test -f release-bundle/SHA256SUMS.txt
          test -f release-bundle/SIGNING-CERT.txt

      - name: Verify release provenance
        run: |
          set -euo pipefail
          grep -Fx 'versionName=2.1.0' release-bundle/RELEASE-METADATA.txt
          grep -Fx 'versionCode=9' release-bundle/RELEASE-METADATA.txt
          grep -Fx 'commit=0e939b70154ecd9599673a6c7d44869d72d00df5' release-bundle/RELEASE-METADATA.txt
          sha256sum -c release-bundle/SHA256SUMS.txt

      - name: Create stable tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --tags origin refs/tags/v2.1.0 >/dev/null 2>&1; then
            echo 'v2.1.0 already exists; verifying target.'
            git fetch origin refs/tags/v2.1.0:refs/tags/v2.1.0
            test "$(git rev-list -n1 v2.1.0)" = '0e939b70154ecd9599673a6c7d44869d72d00df5'
          else
            git tag v2.1.0 0e939b70154ecd9599673a6c7d44869d72d00df5
            git push origin refs/tags/v2.1.0
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.1.0 >/dev/null 2>&1; then
            gh release upload v2.1.0 release-bundle/* --clobber
          else
            gh release create v2.1.0 release-bundle/* \
              --title 'SFP 2.1.0' \
              --notes-file RELEASE_NOTES_2.1.0.md \
              --latest
          fi

      - name: Remove temporary publisher workflow from release branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin release/2.1.0
          git checkout -B release/2.1.0 origin/release/2.1.0
          git rm .github/workflows/release-2.1.0-publish-temp.yml
          git commit -m 'chore: remove temporary 2.1.0 publisher'
          git push origin release/2.1.0
