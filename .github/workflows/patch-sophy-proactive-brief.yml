name: Patch Sophy Proactive Brief

on:
  push:
    branches: ["feat/sophy-proactive-brief"]
    paths:
      - ".github/workflows/patch-sophy-proactive-brief.yml"

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/sophy-proactive-brief
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - run: python3 .github/scripts/patch-sophy-proactive-brief.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Static QA
        run: npm run test:static
      - name: Sophy proactive regression
        run: npx playwright test qa/sophy-proactive-brief.spec.js qa/sophy-foundation.spec.js qa/financial-intelligence.spec.js qa/safe-spend-projection.spec.js --workers=1
      - name: Commit product integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/www/index.html
          if git diff --cached --quiet; then
            echo "No product patch to commit."
          else
            git commit -m "feat(sophy): integrar brief financeiro proativo e explicável"
            git push origin HEAD:feat/sophy-proactive-brief
          fi

# revalidation: 37 focused scenarios after visible-detail test fix
