name: Patch Financial Insights Dashboard

on:
  push:
    branches: ["feat/financial-insights-dashboard"]
    paths:
      - ".github/workflows/patch-financial-insights-dashboard.yml"

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/financial-insights-dashboard
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - name: Apply surgical patch
        run: python3 .github/scripts/patch-financial-insights-dashboard.py
      - name: Install QA dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Static QA
        run: npm run test:static
      - name: Financial intelligence regression
        run: npx playwright test qa/financial-intelligence.spec.js qa/financial-insights-ui.spec.js --workers=1
      - name: Commit product integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/www/index.html
          if git diff --cached --quiet; then
            echo "No product patch to commit."
          else
            git commit -m "feat(intelligence): integrar painel de insights na tela Hoje"
            git push origin HEAD:feat/financial-insights-dashboard
          fi
