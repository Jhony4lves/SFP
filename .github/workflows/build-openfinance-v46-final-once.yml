name: Build Open Finance v46 Final

on:
  push:
    branches:
      - feat/openfinance-auto-sync-navigation-226
    paths:
      - .github/workflows/build-openfinance-v46-final-once.yml

permissions:
  contents: read

env:
  SFP_KEYSTORE_BASE64: ${{ secrets.SFP_KEYSTORE_BASE64 }}
  SFP_KEYSTORE_PASSWORD: ${{ secrets.SFP_KEYSTORE_PASSWORD }}
  SFP_KEY_ALIAS: ${{ secrets.SFP_KEY_ALIAS }}
  SFP_KEY_PASSWORD: ${{ secrets.SFP_KEY_PASSWORD }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore stable release signing key
        shell: bash
        run: |
          set -euo pipefail
          for var in SFP_KEYSTORE_BASE64 SFP_KEYSTORE_PASSWORD SFP_KEY_ALIAS SFP_KEY_PASSWORD; do
            test -n "${!var:-}" || { echo "::error::$var ausente"; exit 1; }
          done
          printf '%s' "$SFP_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sfp-release.jks"
          echo "SFP_KEYSTORE_PATH=$RUNNER_TEMP/sfp-release.jks" >> "$GITHUB_ENV"

      - name: Build final release APK
        run: gradle :app:testDebugUnitTest :app:assembleRelease

      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='com.jhony.sfp'"
          sha256sum "$APK" | tee app-release.sha256

      - uses: actions/upload-artifact@v6
        with:
          name: SFP-v46-openfinance-final-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app-release.sha256
          if-no-files-found: error
