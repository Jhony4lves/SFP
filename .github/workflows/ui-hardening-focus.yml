name: UI Hardening Focus

on:
  push:
    branches: ["qa/visual-bug-fix-sweep-2026-09-02"]
    paths:
      - "app/src/main/assets/www/ui-hardening.css"
      - "app/src/main/assets/www/ui-hardening.js"
      - "app/src/main/assets/www/index.html"
      - "app/src/main/assets/www/sophy-proactive-brief.js"
      - "qa/ui-hardening.spec.js"
      - ".github/workflows/ui-hardening-focus.yml"
  workflow_dispatch:

jobs:
  ui-focus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test qa/ui-hardening.spec.js qa/visual-bug-sweep.spec.js --reporter=list
