name: Apply 2.2 RC2 period-final refinement

on:
  push:
    branches: [ "feat/2.2-integration" ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/2.2-integration

      - name: Apply period-final semantics and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          engine = Path('app/src/main/assets/www/what-if-engine.js')
          text = engine.read_text()
          old = "    const coreEvents=safeArray(projection?.events).map(baselineEvent);"
          new = """    const coreEvents=safeArray(projection?.events).map(baselineEvent).filter(event=>{\n      if(!event.date||!referenceDate||!endDate)return true;\n      const diff=daysBetween(referenceDate,event.date);\n      return diff!=null&&diff>=0&&event.date<=endDate;\n    });"""
          assert old in text
          text = text.replace(old, new, 1)

          marker = "  function simulate({snapshot,scenario}={}){"
          period_fn = r'''  function scenarioPeriodSummary(core,baselineProjections,simulatedProjections,events){
    const dated=safeArray(events).filter(event=>event?.date&&Number.isFinite(civilMs(event.date))).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
    const candidateEnd=dated.at(-1)?.date||core.referenceDate;
    const endDate=(daysBetween(core.referenceDate,candidateEnd)??0)<0?core.referenceDate:candidateEnd;
    const days=Math.max(0,daysBetween(core.referenceDate,endDate)||0);
    const indexed=core.projections.map((projection,index)=>({projection,index,days:Math.max(0,Number(projection?.days)||0)})).sort((a,b)=>a.days-b.days);

    if(!indexed.length){
      const virtual={days,events:[]};
      const base=projectionFor(core,virtual,[]),sim=projectionFor(core,virtual,events);
      return {startDate:core.referenceDate,endDate,days,baselineFinalCents:base.projectedCents,simulatedFinalCents:sim.projectedCents,deltaCents:sim.projectedCents-base.projectedCents,knownCoreThroughDate:core.referenceDate,extendsBeyondKnownCore:days>0,minBalanceCents:sim.minBalanceCents,minDate:sim.minDate,negativeRisk:sim.negativeRisk};
    }

    const max=indexed.at(-1),knownCoreThroughDate=addDays(core.referenceDate,max.days);
    if(days<=max.days){
      const cover=indexed.find(item=>item.days>=days)||max;
      const virtual={...cover.projection,days};
      const base=projectionFor(core,virtual,[]),sim=projectionFor(core,virtual,events);
      return {startDate:core.referenceDate,endDate,days,baselineFinalCents:base.projectedCents,simulatedFinalCents:sim.projectedCents,deltaCents:sim.projectedCents-base.projectedCents,knownCoreThroughDate,extendsBeyondKnownCore:false,minBalanceCents:sim.minBalanceCents,minDate:sim.minDate,negativeRisk:sim.negativeRisk};
    }

    const baseMax=baselineProjections[max.index]||baselineProjectionSummary(core,max.projection);
    const simMax=simulatedProjections[max.index]||projectionFor(core,max.projection,events);
    let balance=cents(simMax.projectedCents),minBalance=cents(simMax.minBalanceCents),minDate=simMax.minDate||knownCoreThroughDate;
    const tail=dated.filter(event=>event.date>knownCoreThroughDate&&event.date<=endDate);
    for(const event of tail){
      balance+=event.type==='income'?event.amountCents:-event.amountCents;
      if(balance<minBalance){minBalance=balance;minDate=event.date;}
    }
    return {startDate:core.referenceDate,endDate,days,baselineFinalCents:cents(baseMax.projectedCents),simulatedFinalCents:balance,deltaCents:balance-cents(baseMax.projectedCents),knownCoreThroughDate,extendsBeyondKnownCore:true,minBalanceCents:minBalance,minDate,negativeRisk:minBalance<0};
  }

'''
          assert marker in text
          text = text.replace(marker, period_fn + marker, 1)

          old = "    const debt=debtImpact(rawScenario),goal=goalImpact(rawScenario),installment=installmentImpact(rawScenario,events);"
          new = old + "\n    const period=scenarioPeriodSummary(core,baselineProjections,projections,events);"
          assert old in text
          text = text.replace(old, new, 1)

          old = "      installmentImpact:installment,\n      assumptions:["
          new = "      installmentImpact:installment,\n      period,\n      assumptions:["
          assert old in text
          text = text.replace(old, new, 1)

          old = "        rawScenario?.type==='installment_purchase'?'Compra parcelada entra no caixa nas datas de vencimento fornecidas; limite de cartão e ciclo de fatura serão tratados pelo adaptador de produto, não inventados pelo engine.':null\n      ].filter(Boolean),"
          new = "        rawScenario?.type==='installment_purchase'?'Compra parcelada entra no caixa nas datas de vencimento fornecidas; limite de cartão e ciclo de fatura serão tratados pelo adaptador de produto, não inventados pelo engine.':null,\n        period.extendsBeyondKnownCore?'Depois do último horizonte conhecido do core, o saldo-base é carregado sem inventar novas entradas ou saídas; somente os eventos do cenário informado continuam sendo aplicados.':null\n      ].filter(Boolean),"
          assert old in text
          text = text.replace(old, new, 1)
          engine.write_text(text)

          ui = Path('app/src/main/assets/www/what-if-ui.js')
          text = ui.read_text()
          old = r'''  function renderReport(report){
    const root=q('#whatIfResult');if(!root)return;
    const base=report.baseline,sim=report.simulated,worst=sim.worstProjection;
    const freeDelta=report.delta.freeCents,availableDelta=report.delta.availableCents;
    const risk=Boolean(worst?.negativeRisk),riskText=risk?`Risco: saldo pode chegar a ${money(worst?.minBalanceCents)}${worst?.minDate?` em ${datePt(worst.minDate)}`:''}.`:`Sem saldo negativo nos horizontes conhecidos deste snapshot.`;
    root.classList.remove('what-if-error');root.hidden=false;root.setAttribute('data-money','');
    root.innerHTML=`<div class="what-if-compare"><div class="what-if-side"><small>Antes</small><strong>${money(base.freeCents)}</strong><em>livre conhecido</em></div><div class="what-if-arrow">→</div><div class="what-if-side"><small>Depois</small><strong>${money(sim.freeCents)}</strong><em>livre no cenário</em></div></div><div class="what-if-delta"><span>Caixa ${availableDelta>=0?'+':''}${money(availableDelta)}</span><span>Livre ${freeDelta>=0?'+':''}${money(freeDelta)}</span><span>${risk?'⚠️ risco de caixa':'✓ trajetória sem negativo conhecido'}</span></div><div class="what-if-detail">${scenarioDetail(report)}<br><br><b>Leitura:</b> ${riskText}<br><br><small>Projeção condicional. Nada foi salvo e o SFP não inventou renda, margem de segurança ou eventos futuros.</small></div>`;
    if(typeof global.applyPrivacy==='function')global.applyPrivacy();
  }'''
          new = r'''  function renderReport(report){
    const root=q('#whatIfResult');if(!root)return;
    const base=report.baseline,sim=report.simulated,worst=sim.worstProjection,period=report.period||null;
    const freeDelta=report.delta.freeCents,availableDelta=report.delta.availableCents;
    const periodDate=period?.endDate||report.referenceDate,baseFinal=period?.baselineFinalCents??base.freeCents,simFinal=period?.simulatedFinalCents??sim.freeCents;
    const risk=Boolean(period?.negativeRisk??worst?.negativeRisk),riskBalance=period?.minBalanceCents??worst?.minBalanceCents,riskDate=period?.minDate??worst?.minDate;
    const riskText=risk?`Risco no período: saldo pode chegar a ${money(riskBalance)}${riskDate?` em ${datePt(riskDate)}`:''}.`:`Sem saldo negativo conhecido até ${datePt(periodDate)} dentro desta projeção condicional.`;
    const horizonNote=period?.extendsBeyondKnownCore?`<br><br><b>Horizonte:</b> o core conhece eventos até ${datePt(period.knownCoreThroughDate)}. Depois disso, o SFP mantém o último saldo conhecido e aplica somente este cenário; não presume novas rendas ou despesas.`:'';
    root.classList.remove('what-if-error');root.hidden=false;root.setAttribute('data-money','');
    root.innerHTML=`<div class="what-if-compare"><div class="what-if-side"><small>Antes</small><strong>${money(baseFinal)}</strong><em>fim do período · ${datePt(periodDate)} · sem cenário</em></div><div class="what-if-arrow">→</div><div class="what-if-side"><small>Depois</small><strong>${money(simFinal)}</strong><em>fim do período · ${datePt(periodDate)} · com cenário</em></div></div><div class="what-if-delta"><span>Caixa agora ${availableDelta>=0?'+':''}${money(availableDelta)}</span><span>Livre agora ${freeDelta>=0?'+':''}${money(freeDelta)}</span><span>${risk?'⚠️ risco de caixa':'✓ trajetória sem negativo conhecido'}</span></div><div class="what-if-detail">${scenarioDetail(report)}<br><br><b>Leitura:</b> ${riskText}${horizonNote}<br><br><small>Projeção condicional. Nada foi salvo e o SFP não inventou renda, margem de segurança ou eventos futuros.</small></div>`;
    if(typeof global.applyPrivacy==='function')global.applyPrivacy();
  }'''
          assert old in text
          text = text.replace(old, new, 1)
          ui.write_text(text)

          spec = Path('qa/what-if-engine.spec.js')
          text = spec.read_text()
          old = "    expect(report.events[0]).toMatchObject({date:'2026-09-10',amountCents:3334,origin:'what_if_installment'});"
          new = old + "\n    expect(report.period).toMatchObject({endDate:'2026-11-10',baselineFinalCents:170000,simulatedFinalCents:159999,deltaCents:-10001,knownCoreThroughDate:'2026-09-30',extendsBeyondKnownCore:true});"
          assert old in text
          text = text.replace(old, new, 1)
          old = "    expect(report.assumptions.join(' ')).toContain('não reduz patrimônio líquido');"
          new = old + "\n    expect(report.period).toMatchObject({endDate:'2027-02-01',baselineFinalCents:170000,simulatedFinalCents:80000,deltaCents:-90000,knownCoreThroughDate:'2026-09-30',extendsBeyondKnownCore:true});"
          assert old in text
          text = text.replace(old, new, 1)
          spec.write_text(text)

          spec = Path('qa/what-if-ui.spec.js')
          text = spec.read_text()
          old = "    await expect(page.locator('#whatIfResult')).toContainText('R$ 100,01');"
          new = old + "\n    await expect(page.locator('#whatIfResult')).toContainText('10/11/2026');\n    await expect(page.locator('#whatIfResult')).toContainText('R$ 1.599,99');"
          assert old in text
          text = text.replace(old, new, 1)
          marker = "  test('amortização maior que o saldo falha fechado e não produz relatório',async({page})=>{"
          extra = r'''  test('guardar todo mês mostra no Depois o valor final do período completo',async({page})=>{
    await boot(page);await deterministicCore(page);
    await page.locator('#whatIfType').selectOption('monthly_saving');
    await page.locator('#whatIfMonthly').fill('150');
    await page.locator('#whatIfMonths').fill('6');
    await page.locator('#whatIfStart').fill('2026-09-01');
    await page.locator('#whatIfRun').click();
    const report=await page.evaluate(()=>window.SFPWhatIfUI.getLastReport());
    expect(report.period.simulatedFinalCents).toBe(80000);
    await expect(page.locator('#whatIfResult')).toContainText('01/02/2027');
    await expect(page.locator('#whatIfResult')).toContainText('R$ 800,00');
    await expect(page.locator('#whatIfResult')).toContainText('fim do período');
  });

'''
          assert marker in text
          text = text.replace(marker, extra + marker, 1)
          spec.write_text(text)

          gradle = Path('gradle.properties')
          text = gradle.read_text()
          assert 'SFP_VERSION_CODE=10' in text and 'SFP_VERSION_NAME=2.2.0-rc.1' in text
          text = text.replace('SFP_VERSION_CODE=10','SFP_VERSION_CODE=11').replace('SFP_VERSION_NAME=2.2.0-rc.1','SFP_VERSION_NAME=2.2.0-rc.2')
          gradle.write_text(text)
          PY

          git diff --check
          git rm .github/workflows/rc22-period-final-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/www/what-if-engine.js app/src/main/assets/www/what-if-ui.js qa/what-if-engine.spec.js qa/what-if-ui.spec.js gradle.properties
          git commit -m "feat(planning): compare final scenario period"
          git push origin HEAD:feat/2.2-integration
