name: Apply Deep UI Fixes

on:
  push:
    branches: ["qa/visual-bug-fix-sweep-2026-09-02"]
    paths:
      - "tools/apply-deep-ui-fixes.js"
      - ".github/workflows/apply-deep-ui-fixes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: node tools/apply-deep-ui-fixes.js
      - name: Commit generated UI fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/www/index.html \
                  app/src/main/assets/www/sophy-proactive-brief.js \
                  app/src/main/assets/www/safe-spend-ui.js \
                  app/src/main/assets/www/financial-insights-ui.js
          if git diff --cached --quiet; then
            echo "No generated UI changes."
            exit 0
          fi
          git commit -m "fix(ui): apply deep audit layout and accessibility fixes"
          git push
