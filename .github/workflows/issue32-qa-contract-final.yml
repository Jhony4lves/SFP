name: Align final Issue 32 dropdown QA contract

on:
  push:
    branches:
      - fix/issue32-dropdown-scroll-nav

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/issue32-dropdown-scroll-nav
          fetch-depth: 0
      - name: Update stale anchoring assertion
        run: echo '' | base64 -d | python
      - name: Validate
        run: |
          git diff --check
          grep -q "afterGeometry.menuBottom" qa/theme-floating-selects.spec.js
          grep -q "sidebar .nav" qa/theme-floating-selects.spec.js
      - name: Commit and self-delete
        run: |
          rm .github/workflows/issue32-qa-contract-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/theme-floating-selects.spec.js .github/workflows/issue32-qa-contract-final.yml
          git commit -m "test: align dropdown anchoring with bottom-nav avoidance"
          git push origin HEAD:fix/issue32-dropdown-scroll-nav
