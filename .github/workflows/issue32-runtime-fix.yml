name: Issue32 Runtime Observer Fix

on:
  push:
    branches:
      - fix/issue-32-theme-floating-selects

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-32-theme-floating-selects
          fetch-depth: 0
      - name: Apply surgical observer fix and regression
        run: |
          python - <<'PY'
          from pathlib import Path

          asset = Path('app/src/main/assets/www/financial-insights-ui.js')
          text = asset.read_text(encoding='utf-8')
          old = "new MutationObserver(()=>{if(scheduled)return;scheduled=true;queueMicrotask(()=>{scheduled=false;enhanceAll();});}).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class','disabled']});"
          new = "new MutationObserver(()=>{if(scheduled)return;scheduled=true;queueMicrotask(()=>{scheduled=false;enhanceAll();});}).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['disabled']});"
          if old not in text:
              raise SystemExit('Expected global observer contract was not found; refusing broad patch.')
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one observer contract, found {text.count(old)}.')
          asset.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('qa/global-select-observer-regression.spec.js')
          test.write_text("""const { test, expect } = require('@playwright/test');
          const fs = require('fs');
          const path = require('path');

          test('global select enhancer does not observe class churn on document.body', async () => {
            const source = fs.readFileSync(path.join(__dirname, '..', 'app', 'src', 'main', 'assets', 'www', 'financial-insights-ui.js'), 'utf8');
            expect(source).not.toContain("attributeFilter:['class','disabled']");
            expect(source).toContain("attributeFilter:['disabled']");
            expect(source).toContain("childList:true,subtree:true");
          });
          """, encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: git rm .github/workflows/issue32-runtime-fix.yml
      - name: Commit and push
        run: |
          git config user.name "Jhony4lves"
          git config user.email "318408128+Jhony4lves@users.noreply.github.com"
          git add app/src/main/assets/www/financial-insights-ui.js qa/global-select-observer-regression.spec.js
          git commit -m "fix(runtime): stop global class mutation churn"
          git push origin HEAD:fix/issue-32-theme-floating-selects
