name: Patch ERR-014 transfer balances
on:
  push:
    branches: [fix/err-014-transfer-balances]
    paths:
      - scripts/patch_err014_transfer_balances.py
      - .github/workflows/patch-err014-transfer-balances.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/err-014-transfer-balances
      - run: python scripts/patch_err014_transfer_balances.py
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/www/index.html
          git commit -m "fix: show account balances in transfer selectors"
          git push
