name: Validate ERR 008 011
on:
  push:
    branches: [fix/report-err-008-011]
    paths: [.github/workflows/patch-err008-011.yml]
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/report-err-008-011
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test qa/report-money-debt-regression.spec.js
